# passenger API 网关本地配置。
# 测试阶段默认通过 gRPC 调用 usersvc，验证码会由 usersvc 的本地短信日志输出。
httpAddr: ":8091"
# JWT 签名密钥必须通过 PASSENGER_TOKEN_SIGNING_KEY 或 JWT_SIGNING_KEY 注入。
tokenSigningKey: ""
clientMode: "grpc"
userRPCAddr: "127.0.0.1:50052"
orderRPCAddr: "127.0.0.1:50051"
priceRPCAddr: "127.0.0.1:50053"
payRPCAddr: "127.0.0.1:50054"
dispatchRPCAddr: "127.0.0.1:50056"
# 司机服务 RPC 地址；乘客端用于查询司机位置及司机信息。
driverRPCAddr: "127.0.0.1:50055"
locationRPCAddr: "127.0.0.1:50057"
# 聊天 WebSocket 依靠 Redis Pub/Sub 跨网关转发；本地默认 127.0.0.1:6379。
redisAddr: "115.191.16.159:6379"
# 真实聊天服务 RPC 地址（统一方案 V1.0 的 rpc/chatsvc）。
chatRPCAddr: "127.0.0.1:50058"
priceCityCode: "110000"
mysqlDSN: ""
# 七牛云配置通过环境变量注入；此处保留空值，避免密钥提交到仓库。
# 七牛密钥必须通过环境变量注入，禁止写入配置文件。
qiniuAccessKey: ""
qiniuSecretKey: ""
qiniuBucket: "xiaolong-ride"
qiniuDomain: "http://tkiajahyp.hd-bkt.clouddn.com"
qiniuUploadURL: "https://upload.qiniup.com"
