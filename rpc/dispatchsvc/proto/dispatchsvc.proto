syntax = "proto3";

package dispatchsvc;
option go_package = "./;proto";

// 派单服务：订单创建后为订单匹配候选司机并写入派单记录。
service Dispatch {
  // 对指定订单执行派单（P0 为 mock 直派），返回写入的派单记录。
  rpc DispatchOrder(DispatchOrderRequest) returns (DispatchOrderResponse);
  // 分页查询订单的派单记录。
  rpc ListDispatchRecords(ListDispatchRecordsRequest) returns (ListDispatchRecordsResponse);
  // 司机拒单：将指定司机的待派单记录置为已拒绝。
  rpc RejectDispatch(RejectDispatchRequest) returns (RejectDispatchResponse);
  // 订单取消/超时取消：将该订单全部待派单记录置为已取消（Pending -> Cancelled）。
  rpc CancelDispatch(CancelDispatchRequest) returns (CancelDispatchResponse);
  // 分页查询存在超时待派单记录的订单 ID（去重），供 job 超时重派任务使用。
  rpc ListTimeoutPendingOrders(ListTimeoutPendingOrdersRequest) returns (ListTimeoutPendingOrdersResponse);
}

message CancelDispatchRequest {
  int64 order_id = 1;
  string reason = 2;
}

message CancelDispatchResponse {
  int64 order_id = 1;
  int64 affected = 2; // 被置为已取消的派单记录数
}

message ListTimeoutPendingOrdersRequest {
  int64 timeout_seconds = 1; // 超时秒数，0 时默认 60
  int32 page = 2;            // 默认 1
  int32 page_size = 3;       // 默认 20，上限 100
}

message ListTimeoutPendingOrdersResponse {
  repeated int64 order_ids = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message RejectDispatchRequest {
  int64 order_id = 1;
  int64 driver_id = 2;
  string reason = 3;
}

message RejectDispatchResponse {
  int64 order_id = 1;
  int64 driver_id = 2;
  int32 status = 3; // 拒单后的派单状态（REJECTED）
}

message DispatchOrderRequest {
  int64 order_id = 1;
  double from_longitude = 2;
  double from_latitude = 3;
  int32 car_type = 4;
  string city_code = 5;
  repeated int64 exclude_driver_ids = 6; // 改派/重派时排除的司机（如原司机）
  int32 order_type = 7; // 订单类型：1 实时单 2 预约单
}

message DispatchOrderResponse {
  int64 order_id = 1;
  repeated DispatchRecord list = 2;
}

message DispatchRecord {
  int64 id = 1;
  int64 order_id = 2;
  int64 driver_id = 3;
  int32 dispatch_type = 4;
  int32 status = 5;
  double match_score = 6;
  string remark = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  string reject_reason = 10; // 司机拒单原因
}

message ListDispatchRecordsRequest {
  int64 order_id = 1;  // 按订单查询；与 driver_id 二选一，优先 order_id
  int64 driver_id = 2; // 按司机查询；order_id 为 0 时生效
  int32 status = 3;    // 可选，0 表示全部，否则按派单状态过滤（仅 driver_id 查询生效）
  int32 page = 4;      // 默认 1
  int32 page_size = 5; // 默认 20，上限 100
}

message ListDispatchRecordsResponse {
  repeated DispatchRecord list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
