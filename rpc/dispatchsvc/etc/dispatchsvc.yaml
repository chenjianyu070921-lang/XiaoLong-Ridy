Name: dispatchsvc.rpc
ListenOn: 0.0.0.0:8083
mysql:
  dsn: root:root123456@tcp(127.0.0.1:3306)/xiaolong_ridy?charset=utf8mb4&parseTime=True&loc=Local
myredis:
  host: 127.0.0.1:6379
  pass: ""
  db: 0
  poolSize: 20
  dialTimeout: 0
  readTimeout: 0
  writeTimeout: 0
# 是否允许 GEO 查不到司机时回退 mock 候选（仅联调演示用，默认关闭）
enableMockDispatch: false
# 派单超时阈值（秒），超过仍未接单的 Pending 记录视为超时并可重派
dispatchTimeoutSeconds: 60
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: dispatchsvc.rpc
