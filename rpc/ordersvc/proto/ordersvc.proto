syntax = "proto3";

package ordersvc;

option go_package = "./;proto";

service Order {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc AcceptOrder(AcceptOrderRequest) returns (AcceptOrderResponse);
  rpc ConfirmArrive(ConfirmArriveRequest) returns (ConfirmArriveResponse);
  rpc StartTrip(StartTripRequest) returns (StartTripResponse);
  rpc FinishTrip(FinishTripRequest) returns (FinishTripResponse);
  rpc ConfirmPaid(ConfirmPaidRequest) returns (ConfirmPaidResponse);
  rpc RefundOrder(RefundOrderRequest) returns (RefundOrderResponse);
  rpc TimeoutCancel(TimeoutCancelRequest) returns (TimeoutCancelResponse);
  rpc ListTimeoutOrders(ListTimeoutOrdersRequest) returns (ListTimeoutOrdersResponse);
  rpc ListOrderStatusLogs(ListOrderStatusLogsRequest) returns (ListOrderStatusLogsResponse);
  rpc RedispatchOrder(RedispatchOrderRequest) returns (RedispatchOrderResponse); // 人工改派
  rpc ForceRefundOrder(ForceRefundOrderRequest) returns (ForceRefundOrderResponse); // 管理员强制退款
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_WAIT_ACCEPT = 1; // 待接单
  ORDER_STATUS_ACCEPTED = 2;    // 已接单
  ORDER_STATUS_ON_TRIP = 3;     // 行程中
  ORDER_STATUS_WAIT_PAY = 4;    // 待支付
  ORDER_STATUS_COMPLETED = 5;   // 已完成
  ORDER_STATUS_CANCELLED = 6;   // 已取消
  ORDER_STATUS_REFUNDED = 7;   // 已退款
}

// 添加订单：乘客叫车后创建一笔订单，状态初始为待接单。
message CreateOrderRequest {
  int64 user_id = 1;
  int32 car_type = 2; // 车型：1特惠快车 2快车 3拼车
  string from_address = 3;
  double from_longitude = 4;
  double from_latitude = 5;
  string to_address = 6;
  double to_longitude = 7;
  double to_latitude = 8;
  int64 estimated_distance_m = 9; // 预估距离（米）
  int64 estimated_duration_s = 10; // 预估时长（秒）
  int64 estimated_price_cents = 11; // 预估价格（分）
  string city_code = 12; // 城市编码（行政区划码），空时按默认城市计价
  int64 coupon_id = 13; // 锁定的优惠券 ID，0 表示未使用优惠券
  int64 discount_cents = 14; // 优惠金额（分），由服务端计价/校验后回填
}

message CreateOrderResponse {
  int64 order_id = 1;
  string order_no = 2;
  int64 estimated_price_cents = 3;
  OrderStatus status = 4;
  int64 created_at = 5; // Unix 秒
  int64 coupon_id = 6; // 锁定的优惠券 ID
  int64 discount_cents = 7; // 优惠金额（分）
  int64 payable_cents = 8; // 实付金额（分）
}

// 取消订单：乘客/司机/系统/管理员取消，订单进入已取消状态。
message CancelOrderRequest {
  int64 order_id = 1;
  string operator_type = 2; // 取消方：user/driver/system/admin
  int64 operator_id = 3;
  string reason = 4;
}

message CancelOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

// 查询订单详情。
message GetOrderRequest {
  int64 order_id = 1;
}

message GetOrderResponse {
  int64 order_id = 1;
  string order_no = 2;
  int64 user_id = 3;
  int64 driver_id = 4;
  int32 car_type = 5;
  string from_address = 6;
  double from_longitude = 7;
  double from_latitude = 8;
  string to_address = 9;
  double to_longitude = 10;
  double to_latitude = 11;
  int64 estimated_distance_m = 12;
  int64 estimated_duration_s = 13;
  int64 estimated_price_cents = 14;
  OrderStatus status = 15;
  string cancel_reason = 16;
  string cancel_by = 17;
  int64 created_at = 18; // Unix 秒
  int64 updated_at = 19; // Unix 秒
  int64 coupon_id = 20; // 锁定的优惠券 ID
  int64 discount_cents = 21; // 优惠金额（分）
  int64 payable_cents = 22; // 实付金额（分）
  int64 paid_cents = 23; // 已支付金额（分）
  int64 refund_cents = 24; // 已退款金额（分）
  string city_code = 25; // 订单城市编码，用于后续计价和派单
}

// 分页查询订单列表。
message ListOrdersRequest {
  int64 user_id = 1; // 按乘客查询，可选
  int64 driver_id = 2; // 按司机查询，可选
  OrderStatus status = 3; // 按状态过滤，可选
  int32 page = 4; // 默认 1
  int32 page_size = 5; // 默认 20，上限 100
}

message OrderSummary {
  int64 order_id = 1;
  string order_no = 2;
  string from_address = 3;
  string to_address = 4;
  OrderStatus status = 5;
  int64 estimated_price_cents = 6;
  int64 created_at = 7; // Unix 秒
  int64 user_id = 8;
  int64 driver_id = 9;
  int32 car_type = 10;
  double from_longitude = 11;
  double from_latitude = 12;
  double to_longitude = 13;
  double to_latitude = 14;
  int64 estimated_distance_m = 15;
  int64 estimated_duration_s = 16;
  string cancel_reason = 17;
  string cancel_by = 18;
  int64 updated_at = 19; // Unix 秒
}

message ListOrdersResponse {
  repeated OrderSummary list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 查询超时未接单订单：供超时扫描任务分页拉取。
message ListTimeoutOrdersRequest {
  int32 timeout_seconds = 1; // 超时秒数，0 时默认 300
  int32 page = 2;            // 默认 1
  int32 page_size = 3;       // 默认 20，上限 100
}

message ListTimeoutOrdersResponse {
  repeated OrderSummary list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 司机接单：订单从待接单变为已接单。
message AcceptOrderRequest {
  int64 order_id = 1;
  int64 driver_id = 2;
}

message AcceptOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

// 司机到达上车点：状态不变，只记录并推送。
message ConfirmArriveRequest {
  int64 order_id = 1;
  int64 driver_id = 2;
}

message ConfirmArriveResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

// 开始行程：已接单变为行程中。
message StartTripRequest {
  int64 order_id = 1;
  int64 driver_id = 2;
}

message StartTripResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

// 结束行程：行程中变为待支付，保存实际费用快照。
message FinishTripRequest {
  int64 order_id = 1;
  int64 driver_id = 2;
  int64 actual_distance_m = 3;
  int64 actual_duration_s = 4;
  int64 actual_price_cents = 5;
}

message FinishTripResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
  int64 payable_amount_cents = 3;
}

// 超时自动取消：系统任务/消费者调用。
message TimeoutCancelRequest {
  int64 order_id = 1;
  string reason = 2;
}

message TimeoutCancelResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

// 查询订单状态流水。
message ListOrderStatusLogsRequest {
  int64 order_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message OrderStatusLog {
  int64 id = 1;
  int64 order_id = 2;
  int32 from_status = 3;
  int32 to_status = 4;
  string operator_type = 5;
  int64 operator_id = 6;
  string remark = 7;
  int64 created_at = 8; // Unix 秒
}

message ListOrderStatusLogsResponse {
  repeated OrderStatusLog list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 支付成功确认：待支付变为已完成。
message ConfirmPaidRequest {
  int64 order_id = 1;
  string payment_no = 2;
  int64 amount_cents = 3; // 实付金额（分），由支付结果回填，避免前端篡改
  int64 paid_at = 4; // Unix 秒
}

message ConfirmPaidResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
  int64 paid_cents = 3; // 已支付金额（分）
}

// 退款：已完成订单退回款项，订单进入已退款终态。
message RefundOrderRequest {
  int64 order_id = 1;
  int64 user_id = 2;
  string refund_no = 3; // 退款单号（幂等键）
  int64 refund_amount_cents = 4; // 退款金额（分），0 表示全额退款
  string reason = 5;
}

message RefundOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
  int64 refund_cents = 3; // 实际退款金额（分）
}

// 人工改派：解除原司机绑定，订单回到待接单并重新进入派单队列（排除原司机）。
message RedispatchOrderRequest {
  int64 order_id = 1;
  int64 new_driver_id = 2; // 指定新司机（0 表示仅释放回自动派单池）
  int64 operator_id = 3;   // 操作人（管理员）
  string reason = 4;
}

message RedispatchOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
  int64 driver_id = 3; // 改派后的司机（指定改派时为 new_driver_id，否则 0）
}

// 管理员强制退款：可从更多终态（含已支付/行程中异常）发起，记录 operator=admin。
message ForceRefundOrderRequest {
  int64 order_id = 1;
  int64 operator_id = 2;    // 操作管理员
  string refund_no = 3;     // 退款单号（幂等键）
  int64 refund_amount_cents = 4; // 退款金额（分），0 表示按已支付金额全额退款
  string reason = 5;
}

message ForceRefundOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
  int64 refund_cents = 3; // 实际退款金额（分）
}
