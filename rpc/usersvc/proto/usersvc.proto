syntax = "proto3";

package usersvc;

option go_package = "./;proto";

service User {
  // SendSMSCode 发送短信验证码。
  rpc SendSMSCode(SendSMSCodeRequest) returns (SendSMSCodeResponse);
  // LoginBySMS 通过短信验证码登录；首次登录自动创建乘客账号。
  rpc LoginBySMS(LoginBySMSRequest) returns (LoginBySMSResponse);
  // RefreshToken 刷新访问令牌。
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Logout 注销当前登录态。
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // GetProfile 查询乘客个人中心基础资料。
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // SubmitRealName 提交乘客实名信息。
  rpc SubmitRealName(SubmitRealNameRequest) returns (SubmitRealNameResponse);
  // UpdateProfile 更新乘客昵称与头像，空字段表示不修改。
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // CreateAddress 新增乘客常用地址。
  rpc CreateAddress(CreateAddressRequest) returns (AddressInfo);
  // ListAddresses 查询乘客常用地址列表。
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  // UpdateAddress 更新乘客常用地址。
  rpc UpdateAddress(UpdateAddressRequest) returns (AddressInfo);
  // DeleteAddress 删除乘客常用地址。
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  // ClaimCoupon 领取优惠券。
  rpc ClaimCoupon(ClaimCouponRequest) returns (ClaimCouponResponse);
  // ListMyCoupons 查询我的优惠券。
  rpc ListMyCoupons(ListMyCouponsRequest) returns (ListMyCouponsResponse);
  // LockUserCoupon 下单前锁定用户券，防止重复使用。
  rpc LockUserCoupon(LockUserCouponRequest) returns (LockUserCouponResponse);
  // ReleaseUserCoupon 下单失败时释放用户券锁定。
  rpc ReleaseUserCoupon(ReleaseUserCouponRequest) returns (ReleaseUserCouponResponse);
}

// SendSMSCodeRequest 发送短信验证码请求。
message SendSMSCodeRequest {
  string phone = 1; // 手机号
}

// SendSMSCodeResponse 发送短信验证码响应。
message SendSMSCodeResponse {
  bool success = 1; // 是否发送成功
  int64 expire_in = 2; // 验证码有效期，单位：秒
}

// LoginBySMSRequest 短信验证码登录请求。
message LoginBySMSRequest {
  string phone = 1; // 手机号
  string code = 2; // 短信验证码
}

// UserInfo 登录态中返回的用户基础信息。
message UserInfo {
  uint64 user_id = 1; // 用户 ID
  string phone = 2; // 脱敏后的手机号
  string nickname = 3; // 昵称
  string avatar_url = 4; // 头像地址
  string real_name_status = 5; // 实名认证状态：UNVERIFIED/VERIFIED
}

// LoginBySMSResponse 短信验证码登录响应。
message LoginBySMSResponse {
  string token = 1; // Access Token
  string refresh_token = 2; // Refresh Token
  bool is_new_user = 3; // 是否为首次创建的用户
  UserInfo user = 4; // 用户基础信息
}

// RefreshTokenRequest 刷新令牌请求。
message RefreshTokenRequest {
  string refresh_token = 1; // Refresh Token
}

// RefreshTokenResponse 刷新令牌响应。
message RefreshTokenResponse {
  string token = 1; // 新的 Access Token
  string refresh_token = 2; // 新的 Refresh Token
}

// LogoutRequest 注销请求。
message LogoutRequest {
  string token = 1; // 当前 Access Token
}

// LogoutResponse 注销响应。
message LogoutResponse {
  bool success = 1; // 是否注销成功
}

// GetProfileRequest 查询个人中心资料请求。
message GetProfileRequest {
  uint64 user_id = 1; // 用户 ID
}

// GetProfileResponse 查询个人中心资料响应。
message GetProfileResponse {
  UserInfo user = 1; // 用户基础信息
}

// SubmitRealNameRequest 提交实名信息请求。
message SubmitRealNameRequest {
  uint64 user_id = 1; // 用户 ID
  string real_name = 2; // 真实姓名
  string id_card_no = 3; // 身份证号
}

// SubmitRealNameResponse 提交实名信息响应。
message SubmitRealNameResponse {
  UserInfo user = 1; // 更新后的用户基础信息
}

// UpdateProfileRequest 更新个人资料请求。
message UpdateProfileRequest {
  uint64 user_id = 1; // 用户 ID
  string nickname = 2; // 昵称，<=20字，允许特殊符号；为空表示不修改
  string avatar_url = 3; // 头像地址；为空表示不修改
}

// UpdateProfileResponse 更新个人资料响应。
message UpdateProfileResponse {
  UserInfo user = 1; // 更新后的用户基础信息
}

// AddressInfo 表示乘客常用地址信息。
message AddressInfo {
  uint64 id = 1; // 地址 ID
  uint64 user_id = 2; // 用户 ID
  string contact_name = 3; // 联系人姓名
  string contact_phone = 4; // 联系人手机号
  string tag = 5; // 地址标签：home/work/other
  string address = 6; // 详细地址
  double longitude = 7; // 经度
  double latitude = 8; // 纬度
  bool is_default = 9; // 是否默认地址
  int32 sort = 10; // 排序值
}

// CreateAddressRequest 新增常用地址请求。
message CreateAddressRequest {
  uint64 user_id = 1; // 用户 ID
  string contact_name = 2; // 联系人姓名
  string contact_phone = 3; // 联系人手机号
  string tag = 4; // 地址标签
  string address = 5; // 详细地址
  double longitude = 6; // 经度
  double latitude = 7; // 纬度
  bool is_default = 8; // 是否默认地址
  int32 sort = 9; // 排序值
}

// ListAddressesRequest 查询常用地址列表请求。
message ListAddressesRequest {
  uint64 user_id = 1; // 用户 ID
}

// ListAddressesResponse 常用地址列表响应。
message ListAddressesResponse {
  repeated AddressInfo list = 1; // 地址列表
}

// UpdateAddressRequest 更新常用地址请求。
message UpdateAddressRequest {
  uint64 id = 1; // 地址 ID
  uint64 user_id = 2; // 用户 ID
  string contact_name = 3; // 联系人姓名
  string contact_phone = 4; // 联系人手机号
  string tag = 5; // 地址标签
  string address = 6; // 详细地址
  double longitude = 7; // 经度
  double latitude = 8; // 纬度
  bool is_default = 9; // 是否默认地址
  int32 sort = 10; // 排序值
}

// DeleteAddressRequest 删除常用地址请求。
message DeleteAddressRequest {
  uint64 id = 1; // 地址 ID
  uint64 user_id = 2; // 用户 ID
}

// DeleteAddressResponse 删除常用地址响应。
message DeleteAddressResponse {
  bool success = 1; // 是否删除成功
}

// CouponInfo 表示乘客端展示的优惠券信息。
message CouponInfo {
  uint64 user_coupon_id = 1; // 用户优惠券实例 ID
  uint64 coupon_id = 2; // 优惠券模板 ID
  string name = 3; // 优惠券名称
  int32 type = 4; // 类型：1满减 2折扣 3立减
  int64 face_value_cents = 5; // 面值，单位：分
  int32 discount = 6; // 折扣率百分比，如 85 表示 8.5 折
  int64 threshold_cents = 7; // 使用门槛，单位：分
  int32 car_type = 8; // 适用车型，0 表示全部
  string city_code = 9; // 适用城市，空表示不限
  int32 status = 10; // 用户券状态：1未用 2已用 3过期 4锁定
  int64 received_at = 11; // 领取时间 Unix 秒
  int64 expire_at = 12; // 过期时间 Unix 秒
}

// ClaimCouponRequest 领取优惠券请求。
message ClaimCouponRequest {
  uint64 user_id = 1; // 用户 ID
  uint64 coupon_id = 2; // 优惠券模板 ID
}

// ClaimCouponResponse 领取优惠券响应。
message ClaimCouponResponse {
  CouponInfo user_coupon = 1; // 已领取的用户券
}

// ListMyCouponsRequest 查询我的优惠券请求。
message ListMyCouponsRequest {
  uint64 user_id = 1; // 用户 ID
  int32 status = 2; // 0 表示全部；1未用 2已用 3过期 4锁定
  int32 page = 3; // 页码，从 1 开始；未传时默认第 1 页
  int32 page_size = 4; // 每页数量；未传时使用服务端默认值
}

// ListMyCouponsResponse 查询我的优惠券响应。
message ListMyCouponsResponse {
  repeated CouponInfo list = 1; // 优惠券列表
  int64 total = 2; // 符合条件的优惠券总数
  int32 page = 3; // 当前页码
  int32 page_size = 4; // 当前页大小
}

// LockUserCouponRequest 下单锁券请求。
message LockUserCouponRequest {
  uint64 user_id = 1; // 用户 ID
  uint64 user_coupon_id = 2; // 用户优惠券实例 ID
  uint64 order_id = 3; // 预占订单 ID，下单前未知时可传请求链路 ID 转换值
  int32 car_type = 4; // 本次下单车型
  string city_code = 5; // 本次下单城市
}

// LockUserCouponResponse 下单锁券响应。
message LockUserCouponResponse {
  CouponInfo coupon = 1; // 已锁定的优惠券信息
}

// ReleaseUserCouponRequest 释放锁券请求。
message ReleaseUserCouponRequest {
  uint64 user_id = 1; // 用户 ID
  uint64 user_coupon_id = 2; // 用户优惠券实例 ID
  uint64 order_id = 3; // 锁定时写入的订单 ID
}

// ReleaseUserCouponResponse 释放锁券响应。
message ReleaseUserCouponResponse {
  bool success = 1; // 是否释放成功
}
