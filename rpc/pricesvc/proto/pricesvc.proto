syntax = "proto3";

package pricesvc;

option go_package = "./;proto";

// 计价服务：行程价格预估、优惠抵扣与实际费用落库。
service Price {
  // 行程价格预估：根据计价规则 + 里程/时长估算费用。
  rpc EstimatePrice(EstimatePriceRequest) returns (EstimatePriceResponse);
  // 优惠券抵扣计算：根据优惠券计算折扣与实付金额。
  rpc CalculateDiscount(CalculateDiscountRequest) returns (CalculateDiscountResponse);
  // 实际费用落库：行程结束时由订单模块调用，将实际费用快照写入 order_price。
  rpc SaveActualOrderPrice(SaveActualOrderPriceRequest) returns (SaveActualOrderPriceResponse);
  // 计价规则列表查询。
  rpc ListPriceRules(PriceRuleListRequest) returns (PriceRuleListResponse);
  // 计价规则详情查询。
  rpc GetPriceRule(PriceRuleDetailRequest) returns (PriceRule);
  // 创建计价规则。
  rpc CreatePriceRule(PriceRuleRequest) returns (CreatePriceRuleResponse);
  // 更新计价规则。
  rpc UpdatePriceRule(PriceRuleRequest) returns (CommonResponse);
  // 更新计价规则状态。
  rpc SetPriceRuleStatus(PriceRuleStatusRequest) returns (CommonResponse);
}

// 优惠券类型
enum CouponType {
  COUPON_TYPE_UNSPECIFIED = 0;
  COUPON_TYPE_FIXED = 1;    // 固定金额券
  COUPON_TYPE_DISCOUNT = 2; // 折扣券（如 8 折）
}

// 价格明细项（单位：分）
message PriceDetail {
  int64 base_fee_cents = 1;        // 起步价
  int64 distance_fee_cents = 2;    // 里程费
  int64 time_fee_cents = 3;        // 时长费
  int64 night_fee_cents = 4;       // 夜间附加费
  int64 dynamic_fee_cents = 5;     // 动态调价费
  int64 total_cents = 6;           // 合计（不含优惠）
}

// 行程价格预估请求
message EstimatePriceRequest {
  int64 user_id = 1;
  string city_code = 2;          // 城市编码，如 110000
  int32 car_type = 3;            // 车型：1特惠快车 2快车 3拼车
  int64 distance_m = 4;          // 预估里程（米）
  int64 duration_s = 5;          // 预估时长（秒）
  int64 timestamp = 6;           // 预估时刻（Unix 秒），用于判断夜间时段；0 表示当前时间
}

// 行程价格预估响应
message EstimatePriceResponse {
  int64 price_rule_id = 1;       // 命中的计价规则ID
  PriceDetail detail = 2;        // 费用明细
  int64 total_cents = 3;         // 预估总价（分）
}

// 优惠券信息（本期作为入参传入，不落库）
message Coupon {
  int64 coupon_id = 1;
  CouponType type = 2;
  int64 face_value_cents = 3;    // 固定金额券面额（分）
  int32 discount = 4;            // 折扣券折扣，如 80 表示 8 折
  int64 threshold_cents = 5;     // 使用门槛（分），0 表示无门槛
  int64 max_discount_cents = 6;  // 折扣券最大优惠金额（分）
}

// 优惠券抵扣计算请求
message CalculateDiscountRequest {
  int64 order_id = 1;
  int64 total_cents = 2;         // 抵扣前的订单总金额（分）
  Coupon coupon = 3;             // 使用的优惠券
}

// 优惠券抵扣计算响应
message CalculateDiscountResponse {
  int64 discount_amount_cents = 1;  // 优惠券抵扣金额（分）
  int64 platform_subsidy_cents = 2; // 平台补贴金额（分）
  int64 payable_amount_cents = 3;   // 乘客实付金额（分）
}

// 实际费用落库请求：行程结束时由订单模块调用。
message SaveActualOrderPriceRequest {
  int64 order_id = 1;            // 订单ID
  int64 price_rule_id = 2;       // 命中的计价规则ID（可选，0 表示无）
  int64 actual_price_cents = 3;  // 实际总价（分）
  PriceDetail detail = 4;        // 费用明细（分），可为空（仅落总价）
}

// 实际费用落库响应
message SaveActualOrderPriceResponse {
  bool success = 1;
  int64 order_price_id = 2;      // order_price 记录ID
}

// 通用响应
message CommonResponse {
  string message = 1;
}

// 创建计价规则响应，返回持久化后的规则 ID 供上游审计关联。
message CreatePriceRuleResponse {
  int64 id = 1;
  string message = 2;
}

// 计价规则对象。
message PriceRule {
  int64 id = 1;
  string name = 2;
  string city_code = 3;
  int32 car_type = 4;
  string base_price = 5;
  string base_distance_km = 6;
  string per_km_price = 7;
  string per_minute_price = 8;
  string night_start_time = 9;
  string night_end_time = 10;
  string night_surcharge = 11;
  string dynamic_max_factor = 12;
  int32 status = 13;
  string effective_at = 14;
  string expire_at = 15;
  string created_at = 16;
  string updated_at = 17;
}

// 计价规则列表查询请求。
message PriceRuleListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string city_code = 4;
  int32 car_type = 5;
  int32 status = 6;
}

// 计价规则列表查询响应。
message PriceRuleListResponse {
  repeated PriceRule list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 计价规则详情请求。
message PriceRuleDetailRequest {
  int64 id = 1;
}

// 计价规则保存请求。
message PriceRuleRequest {
  int64 id = 1;
  string name = 2;
  string city_code = 3;
  int32 car_type = 4;
  string base_price = 5;
  string base_distance_km = 6;
  string per_km_price = 7;
  string per_minute_price = 8;
  string night_start_time = 9;
  string night_end_time = 10;
  string night_surcharge = 11;
  string dynamic_max_factor = 12;
  int32 status = 13;
  string effective_at = 14;
  string expire_at = 15;
}

// 计价规则状态修改请求。
message PriceRuleStatusRequest {
  int64 id = 1;
  int32 status = 2;
}
