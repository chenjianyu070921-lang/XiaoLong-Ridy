syntax = "proto3";

package paysvc;

option go_package = "./;proto";

// 支付服务：支付预下单。
service Pay {
  // 支付预下单：创建支付单并调第三方下单（本期为 mock）。
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  // 支付回调：处理第三方支付结果通知（验签 + 更新状态）。
  rpc NotifyPayment(NotifyPaymentRequest) returns (NotifyPaymentResponse);
  // 支付查询：按支付单号或订单ID查询支付状态。
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  // 退款：退款并回写支付单。
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
  // 司机结算：计算平台抽成与司机实收。
  rpc SettleOrder(SettleOrderRequest) returns (SettleOrderResponse);
  rpc ListSettlements(ListSettlementsRequest) returns (ListSettlementsResponse);
}

// 支付渠道
enum PayChannel {
  PAY_CHANNEL_UNSPECIFIED = 0;
  PAY_CHANNEL_WECHAT = 1;   // 微信
  PAY_CHANNEL_ALIPAY = 2;   // 支付宝
  PAY_CHANNEL_BALANCE = 3;  // 余额
}

// 支付预下单请求
message CreatePaymentRequest {
  int64 order_id = 1;
  int64 user_id = 2;
  int64 amount_cents = 3;      // 支付金额（分）
  PayChannel channel = 4;      // 支付渠道
}

// 支付预下单响应
message CreatePaymentResponse {
  int64 payment_id = 1;
  string payment_no = 2;       // 平台支付单号
  string transaction_id = 3;   // 第三方支付流水号（mock）
  string pay_params = 4;       // 支付参数（mock，如预支付 ID/二维码串）
  int32 status = 5;            // 状态：1待支付
}

// 支付回调请求（支付宝异步通知）
message NotifyPaymentRequest {
  string payment_no = 1;       // 平台支付单号（商户订单号 out_trade_no）
  string trade_status = 2;     // 支付宝交易状态：TRADE_SUCCESS / TRADE_CLOSED 等
  string transaction_id = 3;   // 第三方流水号（支付宝 trade_no）
  string sign = 4;             // 签名
  string sign_type = 5;        // 签名类型 RSA2
  int64 paid_at = 6;           // 支付时间（Unix 秒）
  string notify_raw = 7;       // 原始回调参数字符串（验签用，url.Values 序列化）
}

// 支付回调响应
message NotifyPaymentResponse {
  bool success = 1;            // 是否处理成功（成功应回 "success" 给支付宝）
  string message = 2;
}

// 支付查询请求
message GetPaymentRequest {
  string payment_no = 1;       // 按支付单号查（优先）
  int64 order_id = 2;          // 或按订单ID查
}

// 支付查询响应
message GetPaymentResponse {
  int64 payment_id = 1;
  string payment_no = 2;
  int64 order_id = 3;
  int64 amount_cents = 4;      // 支付金额（分）
  string channel = 5;
  int32 status = 6;            // 1待支付 2支付成功 3支付失败 4已退款
  string transaction_id = 7;
  int64 refund_amount_cents = 8; // 已退款金额（分）
}

// 退款请求
message RefundPaymentRequest {
  string payment_no = 1;
  int64 refund_amount_cents = 2; // 退款金额（分）
  string reason = 3;
  string refund_no = 4; // 调用方业务退款单号，用于跨服务幂等与渠道退款标识
}

// 退款响应
message RefundPaymentResponse {
  bool success = 1;
  string refund_no = 2;         // 退款单号（mock）
  int64 refunded_amount_cents = 3; // 累计已退款金额（分）
}

// 司机结算请求
message SettleOrderRequest {
  int64 order_id = 1;
  int64 driver_id = 2;          // 司机ID
  int64 total_amount_cents = 3; // 订单实际总金额（分）
  double commission_rate = 4;   // 平台抽成比例（%），如 20 表示 20%
}

// 司机结算响应
message SettleOrderResponse {
  int64 settlement_id = 1;
  string settlement_no = 2;
  int64 platform_commission_cents = 3; // 平台抽成（分）
  int64 driver_income_cents = 4;       // 司机实收（分）
}

message ListSettlementsRequest {
  int64 driver_id = 1;
  int32 status = 2;
  int64 start_at = 3;
  int64 end_at = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message SettlementBill {
  int64 settlement_id = 1;
  string settlement_no = 2;
  int64 order_id = 3;
  int64 driver_id = 4;
  int64 total_amount_cents = 5;
  int64 platform_commission_cents = 6;
  int64 driver_income_cents = 7;
  int32 status = 8;
  int64 settled_at = 9;
  int64 created_at = 10;
}

message ListSettlementsResponse {
  repeated SettlementBill records = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
