syntax = "proto3";

package driversvc;

option go_package = "./;proto";

enum DriverStatus {
  DRIVER_STATUS_UNSPECIFIED = 0;
  DRIVER_STATUS_PENDING = 1;
  DRIVER_STATUS_NORMAL = 2;
  DRIVER_STATUS_FROZEN = 3;
  DRIVER_STATUS_CANCELLED = 4;
}

enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_PENDING = 1;
  VEHICLE_STATUS_NORMAL = 2;
  VEHICLE_STATUS_DISABLED = 3;
}

service DriverService {
  rpc CreateDriver(CreateDriverRequest) returns (CreateDriverResponse);
  rpc RegisterDriver(CreateDriverRequest) returns (CreateDriverResponse);
  rpc UpdateDriver(UpdateDriverRequest) returns (UpdateDriverResponse);
  rpc DeleteDriver(DeleteDriverRequest) returns (DeleteDriverResponse);
  rpc GetDriver(GetDriverRequest) returns (GetDriverResponse);
  rpc GetDriverByPhone(GetDriverByPhoneRequest) returns (GetDriverByPhoneResponse);
  rpc FreezeDriver(FreezeDriverRequest) returns (CommonResponse);
  rpc UnfreezeDriver(UnfreezeDriverRequest) returns (CommonResponse);

  rpc SetDriverOnline(SetDriverOnlineRequest) returns (SetDriverOnlineResponse);
  rpc SetDriverOffline(SetDriverOfflineRequest) returns (SetDriverOfflineResponse);
  rpc ReportLocation(ReportLocationRequest) returns (ReportLocationResponse);
  rpc SetDriverServiceStatus(SetDriverServiceStatusRequest) returns (SetDriverServiceStatusResponse);
  rpc ApplyAdminPunishment(AdminPunishmentRequest) returns (CommonResponse);
  rpc ReverseAdminPunishment(AdminPunishmentRequest) returns (CommonResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  rpc CreateVehicle(CreateVehicleRequest) returns (CreateVehicleResponse);
  rpc UpdateVehicle(UpdateVehicleRequest) returns (UpdateVehicleResponse);
  rpc DeleteVehicle(DeleteVehicleRequest) returns (DeleteVehicleResponse);
  rpc GetVehicle(GetVehicleRequest) returns (GetVehicleResponse);

  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc LoginBySms(LoginBySMSRequest) returns (LoginResponse);
  rpc ListNearbyDrivers(ListNearbyDriversRequest) returns (ListNearbyDriversResponse);
  rpc GetDriverAiScore(GetDriverAiScoreRequest) returns (GetDriverAiScoreResponse);

  rpc UploadCertification(UploadCertificationRequest) returns (UploadCertificationResponse);
  rpc GetCertification(GetCertificationRequest) returns (GetCertificationResponse);
  rpc ApproveCertification(AuditCertificationRequest) returns (CommonResponse);
  rpc RejectCertification(AuditCertificationRequest) returns (CommonResponse);
  // 管理后台分页查询司机认证审核记录，可按关键词与审核状态筛选。
  rpc AdminListCertifications(AdminListCertificationsRequest) returns (AdminListCertificationsResponse);
  // 管理后台按认证记录 ID 查询详情。
  rpc AdminGetCertification(AdminGetCertificationRequest) returns (AdminCertification);

  rpc CreateWithdraw(CreateWithdrawRequest) returns (CreateWithdrawResponse);
  rpc ListWithdraws(ListWithdrawsRequest) returns (ListWithdrawsResponse);
  // 管理后台分页查询提现申请，可按状态、司机 ID 和关键词（提现单号/收款人/收款账户）过滤。
  rpc AdminListWithdraws(AdminListWithdrawsRequest) returns (ListWithdrawsResponse);
  // 管理后台审核提现申请：approve=true 打款成功（置为状态 2 并写打款时间），approve=false 打款失败（置为状态 3，备注必填）。
  rpc AuditWithdraw(AuditWithdrawRequest) returns (AuditWithdrawResponse);
}

message Driver {
  int64 id = 1;
  string phone = 2;
  string password_hash = 3;
  string real_name = 4;
  string id_card_no = 5;
  string driver_license_no = 6;
  string avatar_url = 7;
  DriverStatus status = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int32 online_status = 11;
  int64 vehicle_id = 12;
  string plate_no = 13;
  int32 vehicle_status = 14;
  int64 certification_id = 15;
  int32 audit_status = 16;
  string audit_remark = 17;
}

message CreateDriverRequest {
  string phone = 1;
  string password_hash = 2;
  string real_name = 3;
  string id_card_no = 4;
  string driver_license_no = 5;
  string avatar_url = 6;
}

message CreateDriverResponse {
  int64 id = 1;
  DriverStatus status = 2;
  int64 created_at = 3;
}

message UpdateDriverRequest {
  int64 id = 1;
  optional string phone = 2;
  optional string password_hash = 3;
  optional string real_name = 4;
  optional string id_card_no = 5;
  optional string driver_license_no = 6;
  optional string avatar_url = 7;
  optional DriverStatus status = 8;
}

message UpdateDriverResponse {
  int64 id = 1;
  DriverStatus status = 2;
  int64 updated_at = 3;
}

message DeleteDriverRequest {
  int64 id = 1;
}

message DeleteDriverResponse {
  int64 id = 1;
  bool success = 2;
}

message GetDriverRequest {
  int64 id = 1;
}

message GetDriverResponse {
  Driver driver = 1;
}

message FreezeDriverRequest {
  int64 driver_id = 1;
  string reason = 2;
  int64 operator_id = 3;
  string ip = 4;
}

message UnfreezeDriverRequest {
  int64 driver_id = 1;
  string reason = 2;
  int64 operator_id = 3;
  string ip = 4;
}

message SetDriverOnlineRequest {
  int64 driver_id = 1;
  string device_id = 2;
  double longitude = 3;
  double latitude = 4;
}

message SetDriverOnlineResponse {
  int64 driver_id = 1;
  int32 online_status = 2;
  bool kicked = 3;
}

message SetDriverOfflineRequest {
  int64 driver_id = 1;
  string device_id = 2;
  double longitude = 3;
  double latitude = 4;
}

message SetDriverOfflineResponse {
  int64 driver_id = 1;
  int32 online_status = 2;
  bool kicked = 3;
}

message ReportLocationRequest {
  int64 driver_id = 1;
  string device_id = 2;
  double longitude = 3;
  double latitude = 4;
}

message ReportLocationResponse {
  int64 driver_id = 1;
  int32 online_status = 2;
  bool kicked = 3;
  int64 report_time = 4;
}

message SetDriverServiceStatusRequest {
  int64 driver_id = 1;
  int32 online_status = 2;
}

message SetDriverServiceStatusResponse {
  int64 driver_id = 1;
  int32 online_status = 2;
  int64 updated_at = 3;
}

// AdminPunishmentRequest 表示司机域执行管理后台处罚所需的最小载荷。
message AdminPunishmentRequest {
  int64 driver_id = 1;
  string punishment_no = 2;
  string event_id = 3;
  string actions = 4;
  int32 score_delta = 5;
  int32 priority_weight_delta = 6;
}

message GetDriverByPhoneRequest {
  string phone = 1;
}

message GetDriverByPhoneResponse {
  Driver driver = 1;
}

message Vehicle {
  int64 id = 1;
  int64 driver_id = 2;
  string plate_no = 3;
  string brand = 4;
  string model = 5;
  string color = 6;
  int32 vehicle_type = 7;
  optional int64 registration_date = 8;
  string insurance_no = 9;
  optional int64 insurance_expire_at = 10;
  VehicleStatus status = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message CreateVehicleRequest {
  int64 driver_id = 1;
  string plate_no = 2;
  string brand = 3;
  string model = 4;
  string color = 5;
  int32 vehicle_type = 6;
  optional int64 registration_date = 7;
  string insurance_no = 8;
  optional int64 insurance_expire_at = 9;
}

message CreateVehicleResponse {
  int64 id = 1;
  VehicleStatus status = 2;
  int64 created_at = 3;
}

message UpdateVehicleRequest {
  int64 id = 1;
  optional int64 driver_id = 2;
  optional string plate_no = 3;
  optional string brand = 4;
  optional string model = 5;
  optional string color = 6;
  optional int32 vehicle_type = 7;
  optional int64 registration_date = 8;
  optional string insurance_no = 9;
  optional int64 insurance_expire_at = 10;
  optional VehicleStatus status = 11;
}

message UpdateVehicleResponse {
  int64 id = 1;
  VehicleStatus status = 2;
  int64 updated_at = 3;
}

message DeleteVehicleRequest {
  int64 id = 1;
  int64 driver_id = 2;
}

message DeleteVehicleResponse {
  int64 id = 1;
  bool success = 2;
}

message GetVehicleRequest {
  int64 id = 1;
}

message GetVehicleResponse {
  Vehicle vehicle = 1;
}

message ListDriversRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional DriverStatus status = 3;
  string keyword = 4;
}

message ListDriversResponse {
  repeated Driver drivers = 1;
  int64 total = 2;
}

message LoginRequest {
  string phone = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expire_in = 2;
  Driver driver = 3;
}

message LoginBySMSRequest {
  string phone = 1;
}

message NearbyDriver {
  int64 driver_id = 1;
  double longitude = 2;
  double latitude = 3;
  int32 distance_meters = 4;
}

message ListNearbyDriversRequest {
  double longitude = 1;
  double latitude = 2;
  double radius_meters = 3;
  int32 limit = 4;
}

message ListNearbyDriversResponse {
  repeated NearbyDriver drivers = 1;
}

message GetDriverAiScoreRequest {
  int64 driver_id = 1;
}

message AiScoreFactor {
  string key = 1;
  string label = 2;
  double value = 3;
  string impact = 4;
  string hint = 5;
}

message GetDriverAiScoreResponse {
  int64 driver_id = 1;
  double ai_score = 2;
  int32 level = 3;
  repeated AiScoreFactor factors = 4;
  bool degraded = 5;
  string degrade_reason = 6;
}

message UploadCertificationRequest {
  int64 driver_id = 1;
  int64 vehicle_id = 2;
  string id_card_front = 3;
  string id_card_back = 4;
  string driver_license = 5;
  string vehicle_license = 6;
}

message CertificationInfo {
  int64 id = 1;
  int64 driver_id = 2;
  int64 vehicle_id = 3;
  string id_card_front_url = 4;
  string id_card_back_url = 5;
  string driver_license_url = 6;
  string vehicle_license_url = 7;
  int32 audit_status = 8;
  string audit_remark = 9;
}

message UploadCertificationResponse {
  int64 id = 1;
  CertificationInfo certification = 2;
}

message GetCertificationRequest {
  int64 driver_id = 1;
}

message GetCertificationResponse {
  CertificationInfo certification = 1;
  bool found = 2;
}

// AdminListCertificationsRequest 表示管理后台司机认证审核列表筛选条件。
message AdminListCertificationsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;          // 司机手机号/姓名或车牌号
  optional int32 audit_status = 4; // 审核状态：1待审核 2通过 3驳回；不传表示全部
  string start_time = 5;       // 认证创建开始时间，格式 2006-01-02 15:04:05
  string end_time = 6;         // 认证创建结束时间，格式 2006-01-02 15:04:05
}

// AdminCertification 表示管理后台展示的司机认证审核记录（含司机与车辆摘要）。
message AdminCertification {
  int64 id = 1;
  int64 driver_id = 2;
  int64 vehicle_id = 3;
  string driver_phone = 4;
  string driver_name = 5;
  int32 driver_status = 6;
  string plate_no = 7;
  int32 vehicle_status = 8;
  string id_card_front_url = 9;
  string id_card_back_url = 10;
  string driver_license_url = 11;
  string vehicle_license_url = 12;
  int32 audit_status = 13;
  string audit_remark = 14;
  int64 audited_by = 15;
  int64 audited_at = 16;       // Unix 秒，未审核为 0
  int64 created_at = 17;       // Unix 秒
  int64 updated_at = 18;       // Unix 秒
}

// AdminListCertificationsResponse 表示管理后台认证审核分页结果。
message AdminListCertificationsResponse {
  repeated AdminCertification list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// AdminGetCertificationRequest 表示管理后台认证详情查询条件。
message AdminGetCertificationRequest {
  int64 id = 1;
}

message HeartbeatRequest {
  int64 driver_id = 1;
  string device_id = 2;
  double longitude = 3;
  double latitude = 4;
}

message HeartbeatResponse {
  int32 online_status = 1;
  bool kicked = 2;
  int64 server_time = 3;
}

message AuditCertificationRequest {
  int64 certification_id = 1;
  string remark = 2;
  int64 operator_id = 3;
  string ip = 4;
}

message CommonResponse {
  string message = 1;
}

message CreateWithdrawRequest {
  int64 driver_id = 1;
  double amount = 2;
  string payee_name = 3;
  string pay_account = 4;
}

message CreateWithdrawResponse {
  int64 id = 1;
  string withdraw_no = 2;
  int32 status = 3;
  int64 created_at = 4;
}

message ListWithdrawsRequest {
  int64 driver_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message WithdrawRecord {
  int64 id = 1;
  int64 driver_id = 2;
  string withdraw_no = 3;
  double amount = 4;
  string payee_name = 5;
  string pay_account = 6;
  int32 status = 7;
  string remark = 8;
  int64 applied_at = 9;
  int64 paid_at = 10;
  int64 created_at = 11;
}

message AdminListWithdrawsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional int32 status = 3;
  int64 driver_id = 4;
  string keyword = 5;
}

message AuditWithdrawRequest {
  int64 withdraw_id = 1;
  bool approve = 2;
  string remark = 3;
  int64 operator_id = 4;
  string ip = 5;
}

message AuditWithdrawResponse {
  int64 driver_id = 1;
}

message ListWithdrawsResponse {
  repeated WithdrawRecord records = 1;
  int64 total = 2;
}
