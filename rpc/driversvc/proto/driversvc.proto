syntax = "proto3";

package driversvc;
option go_package="./;proto";

// DriverStatus 司机账号状态枚举。
enum DriverStatus {
  DRIVER_STATUS_UNSPECIFIED = 0; // 未指定（默认值，不使用）
  DRIVER_STATUS_PENDING = 1;     // 待审核
  DRIVER_STATUS_NORMAL = 2;      // 正常
  DRIVER_STATUS_FROZEN = 3;      // 冻结
  DRIVER_STATUS_CANCELLED = 4;   // 注销
}

service Driversvc {
  rpc Ping(Request) returns(Response);
  // 司机主表 CRUD
  rpc CreateDriver(CreateDriverRequest) returns(CreateDriverResponse);
  rpc UpdateDriver(UpdateDriverRequest) returns(UpdateDriverResponse);
  rpc DeleteDriver(DeleteDriverRequest) returns(DeleteDriverResponse);
  rpc GetDriver(GetDriverRequest) returns(GetDriverResponse);
  rpc ListDrivers(ListDriversRequest) returns(ListDriversResponse);
  // 车辆资质表 CRUD
  rpc CreateVehicle(CreateVehicleRequest) returns(CreateVehicleResponse);
  rpc UpdateVehicle(UpdateVehicleRequest) returns(UpdateVehicleResponse);
  rpc DeleteVehicle(DeleteVehicleRequest) returns(DeleteVehicleResponse);
  rpc GetVehicle(GetVehicleRequest) returns(GetVehicleResponse);
  rpc ListVehicles(ListVehiclesRequest) returns(ListVehiclesResponse);
  // 司机认证表 CRUD
  rpc CreateCertification(CreateCertificationRequest) returns(CreateCertificationResponse);
  rpc UpdateCertification(UpdateCertificationRequest) returns(UpdateCertificationResponse);
  rpc DeleteCertification(DeleteCertificationRequest) returns(DeleteCertificationResponse);
  rpc GetCertification(GetCertificationRequest) returns(GetCertificationResponse);
  rpc ListCertifications(ListCertificationsRequest) returns(ListCertificationsResponse);
  // 服务分表 CRUD
  rpc CreateScore(CreateScoreRequest) returns(CreateScoreResponse);
  rpc UpdateScore(UpdateScoreRequest) returns(UpdateScoreResponse);
  rpc DeleteScore(DeleteScoreRequest) returns(DeleteScoreResponse);
  rpc GetScore(GetScoreRequest) returns(GetScoreResponse);
  rpc ListScores(ListScoresRequest) returns(ListScoresResponse);
  // 提现表 CRUD
  rpc CreateWithdraw(CreateWithdrawRequest) returns(CreateWithdrawResponse);
  rpc UpdateWithdraw(UpdateWithdrawRequest) returns(UpdateWithdrawResponse);
  rpc DeleteWithdraw(DeleteWithdrawRequest) returns(DeleteWithdrawResponse);
  rpc GetWithdraw(GetWithdrawRequest) returns(GetWithdrawResponse);
  rpc ListWithdraws(ListWithdrawsRequest) returns(ListWithdrawsResponse);
}

// Driver 司机信息，对应 driver 表的完整记录。
message Driver {
  int64 id = 1;                  // 司机 ID
  string phone = 2;              // 手机号（登录账号）
  string password_hash = 3;      // 密码哈希
  string real_name = 4;          // 真实姓名
  string id_card_no = 5;         // 身份证号
  string driver_license_no = 6;  // 驾驶证号
  string avatar_url = 7;         // 头像地址
  DriverStatus status = 8;       // 账号状态
  int64 created_at = 9;          // 创建时间（Unix 秒）
  int64 updated_at = 10;         // 更新时间（Unix 秒）
}

// CreateDriverRequest 创建司机请求。
message CreateDriverRequest {
  string phone = 1;              // 手机号（登录账号）
  string password_hash = 2;      // 密码哈希
  string real_name = 3;          // 真实姓名
  string id_card_no = 4;         // 身份证号
  string driver_license_no = 5;  // 驾驶证号
  string avatar_url = 6;         // 头像地址
}

// CreateDriverResponse 创建司机响应。
message CreateDriverResponse {
  int64 id = 1;                  // 新建司机 ID
  DriverStatus status = 2;       // 初始状态（待审核）
  int64 created_at = 3;          // 创建时间（Unix 秒）
}

// UpdateDriverRequest 更新司机请求，除 id 外均为可选字段。
message UpdateDriverRequest {
  int64 id = 1;                  // 待更新的司机 ID
  optional string phone = 2;     // 手机号（可选）
  optional string password_hash = 3; // 密码哈希（可选）
  optional string real_name = 4; // 真实姓名（可选）
  optional string id_card_no = 5; // 身份证号（可选）
  optional string driver_license_no = 6; // 驾驶证号（可选）
  optional string avatar_url = 7; // 头像地址（可选）
  optional DriverStatus status = 8; // 账号状态（可选）
}

// UpdateDriverResponse 更新司机响应。
message UpdateDriverResponse {
  int64 id = 1;                  // 司机 ID
  DriverStatus status = 2;       // 更新后的状态
  int64 updated_at = 3;          // 更新时间（Unix 秒）
}

// DeleteDriverRequest 删除司机请求。
message DeleteDriverRequest {
  int64 id = 1;                  // 待删除的司机 ID
}

// DeleteDriverResponse 删除司机响应。
message DeleteDriverResponse {
  int64 id = 1;                  // 司机 ID
  bool success = 2;             // 是否删除成功
}

// GetDriverRequest 查询司机详情请求。
message GetDriverRequest {
  int64 id = 1;                  // 待查询的司机 ID
}

// GetDriverResponse 查询司机详情响应。
message GetDriverResponse {
  Driver driver = 1;             // 司机完整信息
}

// ListDriversRequest 分页查询司机列表请求。
message ListDriversRequest {
  DriverStatus status = 1;       // 按状态过滤，可选
  string phone_keyword = 2;      // 手机号模糊匹配，可选
  int32 page = 3;                // 页码，默认 1
  int32 page_size = 4;           // 每页条数，默认 20，上限 100
}

// DriverSummary 司机摘要信息（列表项）。
message DriverSummary {
  int64 id = 1;                  // 司机 ID
  string phone = 2;              // 手机号
  string real_name = 3;          // 真实姓名
  string driver_license_no = 4;  // 驾驶证号
  DriverStatus status = 5;       // 账号状态
  int64 created_at = 6;          // 创建时间（Unix 秒）
}

// ListDriversResponse 分页查询司机列表响应。
message ListDriversResponse {
  repeated DriverSummary list = 1; // 司机摘要列表
  int64 total = 2;                // 符合条件的总记录数
  int32 page = 3;                 // 当前页码
  int32 page_size = 4;            // 每页条数
}

// Request ping 请求（保留兼容）。
message Request {
  string ping = 1;               // 请求内容
}

// Response ping 响应（保留兼容）。
message Response {
  string pong = 1;               // 响应内容
}

// ================= 车辆资质表（driver_vehicle） =================

// Vehicle 车辆信息，对应 driver_vehicle 表的完整记录。
message Vehicle {
  int64 id = 1;                  // 车辆 ID
  int64 driver_id = 2;           // 所属司机 ID
  string plate_no = 3;           // 车牌号
  string brand = 4;              // 品牌
  string model = 5;              // 车型
  string color = 6;              // 车身颜色
  int32 vehicle_type = 7;        // 车辆类型：1特惠快车 2快车 3拼车
  string registration_date = 8;  // 注册日期（YYYY-MM-DD）
  string insurance_no = 9;       // 保险单号
  string insurance_expire_at = 10; // 保险到期日（YYYY-MM-DD）
  int32 status = 11;             // 状态：1待审核 2正常 3禁用
  int64 created_at = 12;         // 创建时间（Unix 秒）
  int64 updated_at = 13;         // 更新时间（Unix 秒）
}

message CreateVehicleRequest {
  int64 driver_id = 1;           // 所属司机 ID
  string plate_no = 2;           // 车牌号
  string brand = 3;              // 品牌
  string model = 4;              // 车型
  string color = 5;              // 车身颜色
  int32 vehicle_type = 6;        // 车辆类型
  string registration_date = 7;  // 注册日期
  string insurance_no = 8;       // 保险单号
  string insurance_expire_at = 9; // 保险到期日
}

message CreateVehicleResponse {
  int64 id = 1;                  // 新建车辆 ID
  int32 status = 2;              // 初始状态（待审核）
}

message UpdateVehicleRequest {
  int64 id = 1;                  // 待更新的车辆 ID
  optional int64 driver_id = 2;  // 所属司机 ID（可选）
  optional string plate_no = 3;  // 车牌号（可选）
  optional string brand = 4;     // 品牌（可选）
  optional string model = 5;     // 车型（可选）
  optional string color = 6;     // 车身颜色（可选）
  optional int32 vehicle_type = 7; // 车辆类型（可选）
  optional string registration_date = 8; // 注册日期（可选）
  optional string insurance_no = 9; // 保险单号（可选）
  optional string insurance_expire_at = 10; // 保险到期日（可选）
  optional int32 status = 11;     // 状态（可选）
}

message UpdateVehicleResponse {
  int64 id = 1;                  // 车辆 ID
  int32 status = 2;              // 更新后的状态
  int64 updated_at = 3;          // 更新时间（Unix 秒）
}

message DeleteVehicleRequest {
  int64 id = 1;                  // 待删除的车辆 ID
}

message DeleteVehicleResponse {
  int64 id = 1;                  // 车辆 ID
  bool success = 2;             // 是否删除成功
}

message GetVehicleRequest {
  int64 id = 1;                  // 待查询的车辆 ID
}

message GetVehicleResponse {
  Vehicle vehicle = 1;           // 车辆完整信息
}

message ListVehiclesRequest {
  int64 driver_id = 1;           // 按司机过滤，可选
  int32 status = 2;              // 按状态过滤，可选
  int32 page = 3;                // 页码，默认 1
  int32 page_size = 4;           // 每页条数，默认 20，上限 100
}

message VehicleSummary {
  int64 id = 1;                  // 车辆 ID
  int64 driver_id = 2;           // 所属司机 ID
  string plate_no = 3;           // 车牌号
  string brand = 4;              // 品牌
  int32 vehicle_type = 5;        // 车辆类型
  int32 status = 6;              // 状态
}

message ListVehiclesResponse {
  repeated VehicleSummary list = 1; // 车辆摘要列表
  int64 total = 2;                // 符合条件的总记录数
  int32 page = 3;                 // 当前页码
  int32 page_size = 4;            // 每页条数
}

// ================= 司机认证表（driver_certification） =================

// Certification 认证信息，对应 driver_certification 表的完整记录。
message Certification {
  int64 id = 1;                  // 认证 ID
  int64 driver_id = 2;           // 所属司机 ID
  int64 vehicle_id = 3;          // 关联车辆 ID
  string id_card_front_url = 4;  // 身份证人像面
  string id_card_back_url = 5;   // 身份证国徽面
  string driver_license_url = 6; // 驾驶证照片
  string vehicle_license_url = 7; // 行驶证照片
  int32 audit_status = 8;        // 审核状态：1待审核 2通过 3驳回
  string audit_remark = 9;       // 驳回原因/审核备注
  int64 audited_by = 10;         // 审核人（管理员 ID）
  int64 audited_at = 11;         // 审核时间（Unix 秒）
  int64 created_at = 12;         // 创建时间（Unix 秒）
  int64 updated_at = 13;         // 更新时间（Unix 秒）
}

message CreateCertificationRequest {
  int64 driver_id = 1;           // 所属司机 ID
  int64 vehicle_id = 2;          // 关联车辆 ID
  string id_card_front_url = 3;  // 身份证人像面
  string id_card_back_url = 4;   // 身份证国徽面
  string driver_license_url = 5; // 驾驶证照片
  string vehicle_license_url = 6; // 行驶证照片
}

message CreateCertificationResponse {
  int64 id = 1;                  // 新建认证 ID
  int32 audit_status = 2;        // 初始审核状态（待审核）
}

message UpdateCertificationRequest {
  int64 id = 1;                  // 待更新的认证 ID
  optional int64 driver_id = 2;  // 所属司机 ID（可选）
  optional int64 vehicle_id = 3; // 关联车辆 ID（可选）
  optional string id_card_front_url = 4; // 身份证人像面（可选）
  optional string id_card_back_url = 5; // 身份证国徽面（可选）
  optional string driver_license_url = 6; // 驾驶证照片（可选）
  optional string vehicle_license_url = 7; // 行驶证照片（可选）
  optional int32 audit_status = 8; // 审核状态（可选）
  optional string audit_remark = 9; // 驳回原因/审核备注（可选）
  optional int64 audited_by = 10;  // 审核人（可选）
  optional int64 audited_at = 11;  // 审核时间（可选）
}

message UpdateCertificationResponse {
  int64 id = 1;                  // 认证 ID
  int32 audit_status = 2;        // 更新后的审核状态
  int64 updated_at = 3;          // 更新时间（Unix 秒）
}

message DeleteCertificationRequest {
  int64 id = 1;                  // 待删除的认证 ID
}

message DeleteCertificationResponse {
  int64 id = 1;                  // 认证 ID
  bool success = 2;             // 是否删除成功
}

message GetCertificationRequest {
  int64 id = 1;                  // 待查询的认证 ID
}

message GetCertificationResponse {
  Certification certification = 1; // 认证完整信息
}

message ListCertificationsRequest {
  int64 driver_id = 1;           // 按司机过滤，可选
  int32 audit_status = 2;        // 按审核状态过滤，可选
  int32 page = 3;                // 页码，默认 1
  int32 page_size = 4;           // 每页条数，默认 20，上限 100
}

message CertificationSummary {
  int64 id = 1;                  // 认证 ID
  int64 driver_id = 2;           // 所属司机 ID
  int64 vehicle_id = 3;          // 关联车辆 ID
  int32 audit_status = 4;        // 审核状态
  int64 created_at = 5;          // 创建时间（Unix 秒）
}

message ListCertificationsResponse {
  repeated CertificationSummary list = 1; // 认证摘要列表
  int64 total = 2;                // 符合条件的总记录数
  int32 page = 3;                 // 当前页码
  int32 page_size = 4;            // 每页条数
}

// ================= 服务分表（driver_score） =================

// Score 服务分信息，对应 driver_score 表的完整记录。
message Score {
  int64 id = 1;                  // 主键 ID
  int64 driver_id = 2;           // 所属司机 ID
  double score = 3;              // 服务分
  int32 level = 4;               // 司机等级：1-5
  int32 month_orders = 5;        // 当月完单数
  double month_cancel_rate = 6;  // 当月取消率（%）
  int32 month_complaint_count = 7; // 当月投诉数
  int64 updated_at = 8;          // 更新时间（Unix 秒）
}

message CreateScoreRequest {
  int64 driver_id = 1;           // 所属司机 ID
  double score = 2;              // 服务分，默认 100
  int32 level = 3;               // 司机等级，默认 1
  int32 month_orders = 4;        // 当月完单数
  double month_cancel_rate = 5;  // 当月取消率（%）
  int32 month_complaint_count = 6; // 当月投诉数
}

message CreateScoreResponse {
  int64 id = 1;                  // 新建记录 ID
  int64 driver_id = 2;           // 所属司机 ID
}

message UpdateScoreRequest {
  int64 id = 1;                  // 待更新的记录 ID
  optional int64 driver_id = 2;  // 所属司机 ID（可选）
  optional double score = 3;     // 服务分（可选）
  optional int32 level = 4;      // 司机等级（可选）
  optional int32 month_orders = 5; // 当月完单数（可选）
  optional double month_cancel_rate = 6; // 当月取消率（可选）
  optional int32 month_complaint_count = 7; // 当月投诉数（可选）
}

message UpdateScoreResponse {
  int64 id = 1;                  // 记录 ID
  int64 driver_id = 2;           // 所属司机 ID
  int64 updated_at = 3;          // 更新时间（Unix 秒）
}

message DeleteScoreRequest {
  int64 id = 1;                  // 待删除的记录 ID
}

message DeleteScoreResponse {
  int64 id = 1;                  // 记录 ID
  bool success = 2;             // 是否删除成功
}

message GetScoreRequest {
  int64 id = 1;                  // 待查询的记录 ID
}

message GetScoreResponse {
  Score score = 1;               // 服务分完整信息
}

message ListScoresRequest {
  int64 driver_id = 1;           // 按司机过滤，可选
  int32 page = 2;                // 页码，默认 1
  int32 page_size = 3;           // 每页条数，默认 20，上限 100
}

message ScoreSummary {
  int64 id = 1;                  // 记录 ID
  int64 driver_id = 2;           // 所属司机 ID
  double score = 3;              // 服务分
  int32 level = 4;               // 司机等级
  int32 month_orders = 5;        // 当月完单数
}

message ListScoresResponse {
  repeated ScoreSummary list = 1; // 服务分摘要列表
  int64 total = 2;                // 符合条件的总记录数
  int32 page = 3;                 // 当前页码
  int32 page_size = 4;            // 每页条数
}

// ================= 提现表（driver_withdraw） =================

// Withdraw 提现信息，对应 driver_withdraw 表的完整记录。
message Withdraw {
  int64 id = 1;                  // 提现 ID
  int64 driver_id = 2;           // 所属司机 ID
  string withdraw_no = 3;        // 提现单号
  double amount = 4;             // 提现金额
  string payee_name = 5;         // 收款人姓名
  string pay_account = 6;        // 收款账号
  int32 status = 7;              // 状态：1申请中 2打款成功 3打款失败
  string remark = 8;             // 失败原因/备注
  int64 applied_at = 9;          // 申请时间（Unix 秒）
  int64 paid_at = 10;            // 打款时间（Unix 秒）
  int64 created_at = 11;         // 创建时间（Unix 秒）
}

message CreateWithdrawRequest {
  int64 driver_id = 1;           // 所属司机 ID
  string withdraw_no = 2;         // 提现单号
  double amount = 3;             // 提现金额
  string payee_name = 4;         // 收款人姓名
  string pay_account = 5;        // 收款账号
}

message CreateWithdrawResponse {
  int64 id = 1;                  // 新建提现 ID
  string withdraw_no = 2;        // 提现单号
  int32 status = 3;              // 初始状态（申请中）
}

message UpdateWithdrawRequest {
  int64 id = 1;                  // 待更新的提现 ID
  optional int64 driver_id = 2;  // 所属司机 ID（可选）
  optional string withdraw_no = 3; // 提现单号（可选）
  optional double amount = 4;    // 提现金额（可选）
  optional string payee_name = 5; // 收款人姓名（可选）
  optional string pay_account = 6; // 收款账号（可选）
  optional int32 status = 7;     // 状态（可选）
  optional string remark = 8;    // 失败原因/备注（可选）
  optional int64 applied_at = 9; // 申请时间（可选）
  optional int64 paid_at = 10;   // 打款时间（可选）
}

message UpdateWithdrawResponse {
  int64 id = 1;                  // 提现 ID
  int32 status = 2;              // 更新后的状态
}

message DeleteWithdrawRequest {
  int64 id = 1;                  // 待删除的提现 ID
}

message DeleteWithdrawResponse {
  int64 id = 1;                  // 提现 ID
  bool success = 2;             // 是否删除成功
}

message GetWithdrawRequest {
  int64 id = 1;                  // 待查询的提现 ID
}

message GetWithdrawResponse {
  Withdraw withdraw = 1;         // 提现完整信息
}

message ListWithdrawsRequest {
  int64 driver_id = 1;           // 按司机过滤，可选
  int32 status = 2;              // 按状态过滤，可选
  int32 page = 3;                // 页码，默认 1
  int32 page_size = 4;           // 每页条数，默认 20，上限 100
}

message WithdrawSummary {
  int64 id = 1;                  // 提现 ID
  int64 driver_id = 2;           // 所属司机 ID
  string withdraw_no = 3;        // 提现单号
  double amount = 4;             // 提现金额
  int32 status = 5;              // 状态
  int64 applied_at = 6;          // 申请时间（Unix 秒）
}

message ListWithdrawsResponse {
  repeated WithdrawSummary list = 1; // 提现摘要列表
  int64 total = 2;                // 符合条件的总记录数
  int32 page = 3;                 // 当前页码
  int32 page_size = 4;            // 每页条数
}

