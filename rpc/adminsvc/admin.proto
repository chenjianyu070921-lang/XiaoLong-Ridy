  int64 received_count = 8;
  int32 per_user_limit = 9;
  string valid_start_at = 10;
  string valid_end_at = 11;
  int32 status = 12;
  string created_at = 13;
  string updated_at = 14;
}

message CouponListResponse {
  repeated Coupon list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AbnormalOrder {
