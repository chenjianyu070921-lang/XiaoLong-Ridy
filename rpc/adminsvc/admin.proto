syntax = "proto3";

package adminsvc;

option go_package = "./adminsvc";

// AdminService 是管理后台内部 RPC 服务。
// P0 阶段只覆盖登录鉴权、操作日志、用户查询、司机审核和订单查询。
service AdminService {
  // 管理员注册。
  rpc Register(RegisterRequest) returns (AuthResponse);
  // 管理员登录。
  rpc Login(LoginRequest) returns (AuthResponse);
  // 管理员退出登录。
  rpc Logout(LogoutRequest) returns (CommonResponse);
  // 校验管理员登录会话。
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  // 查询当前管理员信息。
  rpc Me(MeRequest) returns (MeResponse);
  // 查询角色菜单。
  rpc Menus(MenusRequest) returns (MenusResponse);
  // 查询管理员列表，仅超级管理员可访问。
  rpc ListAdmins(AdminListRequest) returns (AdminListResponse);
  // 新增管理员，仅超级管理员可访问。
  rpc CreateAdmin(AdminSaveRequest) returns (Admin);
  // 编辑管理员资料和角色，仅超级管理员可访问。
  rpc UpdateAdmin(AdminSaveRequest) returns (Admin);
  // 启用或停用管理员，仅超级管理员可访问。
  rpc SetAdminStatus(AdminStatusRequest) returns (CommonResponse);
  // 重置管理员密码，仅超级管理员可访问。
  rpc ResetAdminPassword(AdminPasswordResetRequest) returns (CommonResponse);
  // 查询操作日志。
  rpc ListOperationLogs(OperationLogListRequest) returns (OperationLogListResponse);
  // 查询用户列表。
  rpc ListUsers(UserListRequest) returns (UserListResponse);
  // 查询用户详情。
  rpc GetUser(UserDetailRequest) returns (User);
  // 查询指定用户的订单历史。
  rpc ListUserOrders(UserHistoryRequest) returns (OrderListResponse);
  // 查询指定用户的优惠券历史。
  rpc ListUserCoupons(UserCouponHistoryRequest) returns (UserCouponHistoryResponse);
  // 冻结用户。
  rpc FreezeUser(ChangeUserStatusRequest) returns (CommonResponse);
  // 解封用户。
  rpc UnfreezeUser(ChangeUserStatusRequest) returns (CommonResponse);
  // 查询司机基础资料列表。
  rpc ListDrivers(DriverListRequest) returns (DriverListResponse);
  // 查询司机基础资料详情。
  rpc GetDriver(DriverDetailRequest) returns (Driver);
  // 冻结司机。
  rpc FreezeDriver(FreezeDriverRequest) returns (CommonResponse);
  // 查询司机审核列表。
  rpc ListDriverCertifications(DriverCertificationListRequest) returns (DriverCertificationListResponse);
  // 查询司机审核详情。
  rpc GetDriverCertification(DriverCertificationDetailRequest) returns (DriverCertification);
  // 审核通过司机认证。
  rpc ApproveDriverCertification(AuditDriverCertificationRequest) returns (CommonResponse);
  // 驳回司机认证。
  rpc RejectDriverCertification(AuditDriverCertificationRequest) returns (CommonResponse);
  // 查询订单列表。
  rpc ListOrders(OrderListRequest) returns (OrderListResponse);
  // 查询订单详情。
  rpc GetOrder(OrderDetailRequest) returns (OrderDetail);
  // 查询订单轨迹。
  rpc GetOrderTrack(OrderTrackRequest) returns (OrderTrackResponse);
  // 后台取消订单。
  rpc CancelOrder(AdminCancelOrderRequest) returns (CommonResponse);
  // 后台人工改派订单。
  rpc RedispatchOrder(AdminRedispatchOrderRequest) returns (AdminRedispatchOrderResponse);
  // 后台发起订单退款。
  rpc RefundOrder(AdminRefundOrderRequest) returns (AdminRefundOrderResponse);
  // 查询异常订单列表。
  rpc ListAbnormalOrders(AbnormalOrderListRequest) returns (AbnormalOrderListResponse);
  // 查询优惠券模板列表。
  rpc ListCoupons(CouponListRequest) returns (CouponListResponse);
  // 创建优惠券模板。
  rpc CreateCoupon(CouponRequest) returns (CreateCouponResponse);
  // 更新优惠券模板。
  rpc UpdateCoupon(CouponRequest) returns (CommonResponse);
  // 下架优惠券模板。
  rpc DisableCoupon(CouponRequest) returns (CommonResponse);
  // 创建优惠券发放任务并同步发放用户券。
  rpc IssueCoupon(CouponIssueRequest) returns (CouponIssueResponse);
  // 查询优惠券发放任务列表。
  rpc ListCouponIssueTasks(CouponIssueTaskListRequest) returns (CouponIssueTaskListResponse);
  // 查询计价规则列表。
  rpc ListPriceRules(PriceRuleListRequest) returns (PriceRuleListResponse);
  // 查询计价规则详情。
  rpc GetPriceRule(PriceRuleDetailRequest) returns (PriceRule);
  // 创建计价规则。
  rpc CreatePriceRule(PriceRuleRequest) returns (CreatePriceRuleResponse);
  // 更新计价规则。
  rpc UpdatePriceRule(PriceRuleRequest) returns (CommonResponse);
  // 启用计价规则。
  rpc EnablePriceRule(PriceRuleStatusRequest) returns (CommonResponse);
  // 停用计价规则。
  rpc DisablePriceRule(PriceRuleStatusRequest) returns (CommonResponse);
  // 查询活动配置列表。
  rpc ListPromotionActivities(PromotionActivityListRequest) returns (PromotionActivityListResponse);
  // 创建活动配置。
  rpc CreatePromotionActivity(PromotionActivityRequest) returns (CommonResponse);
  // 更新活动配置。
  rpc UpdatePromotionActivity(PromotionActivityRequest) returns (CommonResponse);
  // 发布活动配置。
  rpc PublishPromotionActivity(PromotionActivityActionRequest) returns (CommonResponse);
  // 回滚活动配置。
  rpc RollbackPromotionActivity(PromotionActivityActionRequest) returns (CommonResponse);
  // 查询运营总览统计。
  rpc GetStatisticsOverview(StatisticsRequest) returns (StatisticsOverviewResponse);
  // 查询订单统计。
  rpc GetOrderStatistics(StatisticsRequest) returns (OrderStatisticsResponse);
  // 查询司机统计。
  rpc GetDriverStatistics(StatisticsRequest) returns (DriverStatisticsResponse);
  // 查询财务统计。
  rpc GetFinanceStatistics(StatisticsRequest) returns (FinanceStatisticsResponse);
  // 查询优惠券统计。
  rpc GetCouponStatistics(StatisticsRequest) returns (CouponStatisticsResponse);
  // 查询用户统计。
  rpc GetUserStatistics(StatisticsRequest) returns (UserStatisticsResponse);
  // 创建导出任务。
  rpc CreateExportTask(ExportTaskRequest) returns (ExportTaskResponse);
  // 查询导出任务列表。
  rpc ListExportTasks(ExportTaskListRequest) returns (ExportTaskListResponse);
  // 查询导出任务详情。
  rpc GetExportTask(ExportTaskDetailRequest) returns (ExportTask);
  // 查询已授权下载的导出任务文件元数据。
  rpc GetExportDownload(ExportDownloadRequest) returns (ExportDownloadResponse);
  // 流式下载已授权的导出文件内容。
  rpc DownloadExport(ExportDownloadRequest) returns (stream ExportDownloadChunk);
  // 创建后台投诉或申诉工单。
  rpc CreateWorkOrder(WorkOrderRequest) returns (WorkOrder);
  // 查询后台工单列表。
  rpc ListWorkOrders(WorkOrderListRequest) returns (WorkOrderListResponse);
  // 查询后台工单详情。
  rpc GetWorkOrder(WorkOrderDetailRequest) returns (WorkOrder);
  // 执行后台工单流转动作。
  rpc ActWorkOrder(WorkOrderActionRequest) returns (WorkOrder);
  // 批量执行后台工单流转动作。
  rpc BatchActWorkOrders(WorkOrderBatchActionRequest) returns (WorkOrderBatchActionResponse);
  // 新增工单证据索引。
  rpc AddWorkOrderEvidence(WorkOrderEvidenceRequest) returns (WorkOrderEvidence);
  // 查询工单证据列表。
  rpc ListWorkOrderEvidence(WorkOrderEvidenceListRequest) returns (WorkOrderEvidenceListResponse);
  // 查询风控黑名单列表。
  rpc ListBlacklists(BlacklistListRequest) returns (BlacklistListResponse);
  // 新增风控黑名单。
  rpc AddBlacklist(BlacklistRequest) returns (CommonResponse);
  // 解除风控黑名单。
  rpc ReleaseBlacklist(BlacklistRequest) returns (CommonResponse);
  // 查询风控命中记录。
  rpc ListRiskHitRecords(RiskHitRecordListRequest) returns (RiskHitRecordListResponse);
  // 处置风控命中记录。
  rpc HandleRiskHitRecords(RiskHitActionRequest) returns (RiskHitActionResponse);
}

message Admin {
  int64 id = 1;
  string username = 2;
  string real_name = 3;
  int32 role = 4;
  int32 status = 5;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string real_name = 3;
  int32 role = 4;
  int64 operator_admin_id = 5;
  int32 operator_role = 6;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  int64 expires_in = 2;
  Admin admin = 3;
}

message LogoutRequest {
  string token = 1;
}

message ValidateSessionRequest {
  string token = 1;
}

message ValidateSessionResponse {
  Admin admin = 1;
}

message MeRequest {
  int64 admin_id = 1;
  string token = 2;
}

message MeResponse {
  Admin admin = 1;
}

message MenusRequest {
  int64 admin_id = 1;
  int32 role = 2;
  string token = 3;
}

message MenuItem {
  string name = 1;
  string path = 2;
  string icon = 3;
  string perm = 4;
  repeated MenuItem children = 5;
}

message MenusResponse {
  repeated MenuItem items = 1;
}

message CommonResponse {
  string message = 1;
}

// 创建优惠券响应，返回事务提交后的优惠券 ID。
message CreateCouponResponse {
  int64 id = 1;
  string message = 2;
}

// 创建计价规则响应，返回 pricesvc 创建成功后的规则 ID。
message CreatePriceRuleResponse {
  int64 id = 1;
  string message = 2;
}

message OperationLogListRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 admin_id = 3;
  string module = 4;
  string action = 5;
  string target_type = 6;
  int64 target_id = 7;
  string start_time = 8;
  string end_time = 9;
}

message OperationLog {
  int64 id = 1;
  int64 admin_id = 2;
  string module = 3;
  string action = 4;
  string target_type = 5;
  int64 target_id = 6;
  string detail = 7;
  string ip = 8;
  string created_at = 9;
}

message OperationLogListResponse {
  repeated OperationLog list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UserListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int32 status = 4;
  string start_time = 5;
  string end_time = 6;
}

message UserDetailRequest {
  int64 id = 1;
  bool sensitive = 2;
}

// AdminListRequest 表示管理员列表查询条件。
message AdminListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int32 role = 4;
  int32 status = 5;
}

// AdminListResponse 表示管理员列表分页结果。
message AdminListResponse {
  repeated Admin list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// AdminSaveRequest 表示新增或编辑管理员资料。
message AdminSaveRequest {
  int64 id = 1;
  string username = 2;
  string password = 3;
  string real_name = 4;
  int32 role = 5;
  int64 operator_admin_id = 6;
  string ip = 7;
}

// AdminStatusRequest 表示管理员启停操作。
message AdminStatusRequest {
  int64 id = 1;
  int32 status = 2;
  int64 operator_admin_id = 3;
  string reason = 4;
  string ip = 5;
}

// AdminPasswordResetRequest 表示管理员密码重置操作。
message AdminPasswordResetRequest {
  int64 id = 1;
  string password = 2;
  int64 operator_admin_id = 3;
  string ip = 4;
}

// UserHistoryRequest 表示指定用户的只读历史查询条件。
message UserHistoryRequest {
  int64 user_id = 1;
  int32 status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// UserCouponHistoryRequest 表示指定用户的优惠券历史查询条件。
message UserCouponHistoryRequest {
  int64 user_id = 1;
  int32 status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// UserCouponHistory 表示管理后台展示的用户优惠券实例。
message UserCouponHistory {
  int64 user_coupon_id = 1;
  int64 coupon_id = 2;
  string name = 3;
  int32 type = 4;
  int64 face_value_cents = 5;
  int32 discount = 6;
  int64 threshold_cents = 7;
  int32 car_type = 8;
  string city_code = 9;
  int32 status = 10;
  int64 received_at = 11;
  int64 expire_at = 12;
}

// UserCouponHistoryResponse 返回用户优惠券历史分页结果。
message UserCouponHistoryResponse {
  repeated UserCouponHistory list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ChangeUserStatusRequest {
  int64 id = 1;
  int32 status = 2;
  string reason = 3;
  string remark = 4;
  int64 admin_id = 5;
  string ip = 6;
}

message User {
  int64 id = 1;
  string phone = 2;
  string nickname = 3;
  string avatar_url = 4;
  int32 gender = 5;
  string real_name = 6;
  string id_card_no = 7;
  string register_source = 8;
  int32 status = 9;
  string created_at = 10;
  string updated_at = 11;
}

message UserListResponse {
  repeated User list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DriverListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int32 status = 4;
}

message DriverDetailRequest {
  int64 id = 1;
  bool sensitive = 2;
}

message FreezeDriverRequest {
  int64 id = 1;
  string reason = 2;
  string remark = 3;
  int64 admin_id = 4;
  string ip = 5;
}

message Driver {
  int64 id = 1;
  string phone = 2;
  string real_name = 3;
  string id_card_no = 4;
  string driver_license_no = 5;
  string avatar_url = 6;
  int32 status = 7;
  int32 online_status = 8;
  int64 vehicle_id = 9;
  string plate_no = 10;
  int32 vehicle_status = 11;
  int64 certification_id = 12;
  int32 audit_status = 13;
  string audit_remark = 14;
  string created_at = 15;
  string updated_at = 16;
}

message DriverListResponse {
  repeated Driver list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message DriverCertificationListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int32 audit_status = 4;
  string start_time = 5;
  string end_time = 6;
}

message DriverCertificationDetailRequest {
  int64 id = 1;
}

message AuditDriverCertificationRequest {
  int64 id = 1;
  string remark = 2;
  int64 admin_id = 3;
  string ip = 4;
}

message DriverCertification {
  int64 id = 1;
  int64 driver_id = 2;
  int64 vehicle_id = 3;
  string driver_phone = 4;
  string driver_name = 5;
  int32 driver_status = 6;
  string plate_no = 7;
  int32 vehicle_status = 8;
  string id_card_front_url = 9;
  string id_card_back_url = 10;
  string driver_license_url = 11;
  string vehicle_license_url = 12;
  int32 audit_status = 13;
  string audit_remark = 14;
  int64 audited_by = 15;
  string audited_at = 16;
  string created_at = 17;
  string updated_at = 18;
}

message DriverCertificationListResponse {
  repeated DriverCertification list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message OrderListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int32 status = 4;
  int64 user_id = 5;
  int64 driver_id = 6;
  string start_time = 7;
  string end_time = 8;
}

message OrderDetailRequest {
  int64 id = 1;
}

message OrderTrackRequest {
  int64 order_id = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  int32 limit = 4;
}

message OrderTrackPoint {
  int64 id = 1;
  int64 order_id = 2;
  int64 driver_id = 3;
  string longitude = 4;
  string latitude = 5;
  string speed_kmh = 6;
  int32 direction = 7;
  string recorded_at = 8;
}

message OrderTrackResponse {
  repeated OrderTrackPoint points = 1;
}

message AdminCancelOrderRequest {
  int64 order_id = 1;
  string reason = 2;
  int64 admin_id = 3;
  string ip = 4;
  string request_id = 5;
}

message AdminRedispatchOrderRequest {
  int64 order_id = 1;
  int64 new_driver_id = 2;
  string reason = 3;
  int64 admin_id = 4;
  string ip = 5;
  string request_id = 6;
}

message AdminRedispatchOrderResponse {
  int64 order_id = 1;
  int32 status = 2;
  int64 driver_id = 3;
  string message = 4;
}

message AdminRefundOrderRequest {
  int64 order_id = 1;
  int64 refund_amount_cents = 2;
  string reason = 3;
  int64 admin_id = 4;
  string ip = 5;
  string request_id = 6;
}

message AdminRefundOrderResponse {
  int64 order_id = 1;
  int32 status = 2;
  int64 refund_cents = 3;
  string refund_no = 4;
  string message = 5;
}

message Order {
  int64 id = 1;
  string order_no = 2;
  int64 user_id = 3;
  int64 driver_id = 4;
  int32 car_type = 5;
  string from_address = 6;
  string from_longitude = 7;
  string from_latitude = 8;
  string to_address = 9;
  string to_longitude = 10;
  string to_latitude = 11;
  int64 estimated_distance_m = 12;
  int64 estimated_duration_s = 13;
  string estimated_price = 14;
  int32 status = 15;
  string cancel_reason = 16;
  string cancel_by = 17;
  string created_at = 18;
  string updated_at = 19;
}

message OrderStatusLog {
  int64 id = 1;
  int64 order_id = 2;
  int32 from_status = 3;
  int32 to_status = 4;
  string operator_type = 5;
  int64 operator_id = 6;
  string remark = 7;
  string created_at = 8;
}

message DispatchRecord {
  int64 id = 1;
  int64 order_id = 2;
  int64 driver_id = 3;
  int32 dispatch_type = 4;
  int32 status = 5;
  string match_score = 6;
  string remark = 7;
  string created_at = 8;
  string updated_at = 9;
}

message OrderPrice {
  int64 id = 1;
  int64 order_id = 2;
  int64 price_rule_id = 3;
  string estimated_price = 4;
  string actual_price = 5;
  string base_fee = 6;
  string distance_fee = 7;
  string time_fee = 8;
  string night_fee = 9;
  string dynamic_fee = 10;
  string discount_amount = 11;
  string platform_subsidy = 12;
  string payable_amount = 13;
  int32 status = 14;
}

message Payment {
  int64 id = 1;
  string payment_no = 2;
  int64 order_id = 3;
  int64 user_id = 4;
  string amount = 5;
  string channel = 6;
  int32 status = 7;
  string transaction_id = 8;
  string refund_amount = 9;
  string paid_at = 10;
}

message Settlement {
  int64 id = 1;
  string settlement_no = 2;
  int64 order_id = 3;
  int64 driver_id = 4;
  string total_amount = 5;
  string platform_commission_rate = 6;
  string platform_commission = 7;
  string driver_income = 8;
  int32 status = 9;
  string settled_at = 10;
}

message OrderDetail {
