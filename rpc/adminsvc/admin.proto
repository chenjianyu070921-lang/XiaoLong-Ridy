  repeated int64 ids = 1;
  // 处置动作：review_pass/add_blacklist/create_work_order。
  string action = 2;
  // 处置原因、拉黑原因或转工单说明。
  string reason = 3;
  // 转工单标题；为空时由服务端根据命中记录生成。
  string work_order_title = 4;
  // 转工单优先级，1低 2中 3高 4紧急；为空或 0 时由风险等级映射。
  int32 priority = 5;
  // 当前操作管理员 ID。
  int64 admin_id = 6;
  // 操作来源 IP。
  string ip = 7;
}

message RiskHitActionResponse {
  // 本次处置成功的命中记录数量。
  int64 success_count = 1;
  // 本次处置失败的命中记录数量。
  int64 fail_count = 2;
  // 转工单动作创建出的工单 ID 列表。
  repeated int64 work_order_ids = 3;
  // 未处理原因，按命中记录 ID 汇总。
  repeated string failure_reasons = 4;
}
