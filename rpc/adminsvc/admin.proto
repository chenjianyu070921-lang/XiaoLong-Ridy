syntax = "proto3";

package adminsvc;

option go_package = "./adminsvc";

// AdminService 是管理后台内部 RPC 服务。
// P0 阶段只覆盖登录鉴权、操作日志、用户查询、司机审核和订单查询。
service AdminService {
  // 管理员注册。
  rpc Register(RegisterRequest) returns (AuthResponse);
  // 管理员登录。
  rpc Login(LoginRequest) returns (AuthResponse);
  // 管理员退出登录。
  rpc Logout(LogoutRequest) returns (CommonResponse);
  // 校验管理员登录会话。
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  // 查询当前管理员信息。
  rpc Me(MeRequest) returns (MeResponse);
  // 查询角色菜单。
  rpc Menus(MenusRequest) returns (MenusResponse);
  // 查询操作日志。
  rpc ListOperationLogs(OperationLogListRequest) returns (OperationLogListResponse);
  // 查询用户列表。
  rpc ListUsers(UserListRequest) returns (UserListResponse);
  // 查询用户详情。
  rpc GetUser(UserDetailRequest) returns (User);
  // 冻结用户。
  rpc FreezeUser(ChangeUserStatusRequest) returns (CommonResponse);
  // 解封用户。
  rpc UnfreezeUser(ChangeUserStatusRequest) returns (CommonResponse);
  // 查询司机审核列表。
  rpc ListDriverCertifications(DriverCertificationListRequest) returns (DriverCertificationListResponse);
  // 查询司机审核详情。
  rpc GetDriverCertification(DriverCertificationDetailRequest) returns (DriverCertification);
  // 审核通过司机认证。
  rpc ApproveDriverCertification(AuditDriverCertificationRequest) returns (CommonResponse);
  // 驳回司机认证。
  rpc RejectDriverCertification(AuditDriverCertificationRequest) returns (CommonResponse);
  // 查询订单列表。
  rpc ListOrders(OrderListRequest) returns (OrderListResponse);
  // 查询订单详情。
  rpc GetOrder(OrderDetailRequest) returns (OrderDetail);
  // 后台取消订单。
  rpc CancelOrder(AdminCancelOrderRequest) returns (CommonResponse);
  // 查询异常订单列表。
  rpc ListAbnormalOrders(AbnormalOrderListRequest) returns (AbnormalOrderListResponse);
  // 查询优惠券模板列表。
  rpc ListCoupons(CouponListRequest) returns (CouponListResponse);
  // 创建优惠券模板。
  rpc CreateCoupon(CouponRequest) returns (CommonResponse);
  // 更新优惠券模板。
  rpc UpdateCoupon(CouponRequest) returns (CommonResponse);
  // 下架优惠券模板。
  rpc DisableCoupon(CouponRequest) returns (CommonResponse);
  // 创建优惠券发放任务并同步发放用户券。
  rpc IssueCoupon(CouponIssueRequest) returns (CouponIssueResponse);
  // 查询优惠券发放任务列表。
  rpc ListCouponIssueTasks(CouponIssueTaskListRequest) returns (CouponIssueTaskListResponse);
  // 查询计价规则列表。
  rpc ListPriceRules(PriceRuleListRequest) returns (PriceRuleListResponse);
  // 查询计价规则详情。
  rpc GetPriceRule(PriceRuleDetailRequest) returns (PriceRule);
  // 创建计价规则。
  rpc CreatePriceRule(PriceRuleRequest) returns (CommonResponse);
  // 更新计价规则。
  rpc UpdatePriceRule(PriceRuleRequest) returns (CommonResponse);
  // 启用计价规则。
  rpc EnablePriceRule(PriceRuleStatusRequest) returns (CommonResponse);
  // 停用计价规则。
  rpc DisablePriceRule(PriceRuleStatusRequest) returns (CommonResponse);
  // 查询活动配置列表。
  rpc ListPromotionActivities(PromotionActivityListRequest) returns (PromotionActivityListResponse);
  // 创建活动配置。
  rpc CreatePromotionActivity(PromotionActivityRequest) returns (CommonResponse);
  // 更新活动配置。
  rpc UpdatePromotionActivity(PromotionActivityRequest) returns (CommonResponse);
  // 发布活动配置。
  rpc PublishPromotionActivity(PromotionActivityActionRequest) returns (CommonResponse);
  // 回滚活动配置。
  rpc RollbackPromotionActivity(PromotionActivityActionRequest) returns (CommonResponse);
  // 查询运营总览统计。
  rpc GetStatisticsOverview(StatisticsRequest) returns (StatisticsOverviewResponse);
  // 查询订单统计。
  rpc GetOrderStatistics(StatisticsRequest) returns (OrderStatisticsResponse);
  // 查询优惠券统计。
  rpc GetCouponStatistics(StatisticsRequest) returns (CouponStatisticsResponse);
  // 创建导出任务。
  rpc CreateExportTask(ExportTaskRequest) returns (ExportTaskResponse);
  // 查询导出任务列表。
  rpc ListExportTasks(ExportTaskListRequest) returns (ExportTaskListResponse);
  // 查询导出任务详情。
  rpc GetExportTask(ExportTaskDetailRequest) returns (ExportTask);
  // 查询已授权下载的导出任务文件元数据。
  rpc GetExportDownload(ExportDownloadRequest) returns (ExportDownloadResponse);
  // 流式下载已授权的导出文件内容。
  rpc DownloadExport(ExportDownloadRequest) returns (stream ExportDownloadChunk);
  // 创建后台投诉或申诉工单。
  rpc CreateWorkOrder(WorkOrderRequest) returns (WorkOrder);
  // 查询后台工单列表。
  rpc ListWorkOrders(WorkOrderListRequest) returns (WorkOrderListResponse);
  // 查询后台工单详情。
  rpc GetWorkOrder(WorkOrderDetailRequest) returns (WorkOrder);
  // 执行后台工单流转动作。
  rpc ActWorkOrder(WorkOrderActionRequest) returns (WorkOrder);
  // 新增工单证据索引。
  rpc AddWorkOrderEvidence(WorkOrderEvidenceRequest) returns (WorkOrderEvidence);
  // 查询工单证据列表。
  rpc ListWorkOrderEvidence(WorkOrderEvidenceListRequest) returns (WorkOrderEvidenceListResponse);
  // 查询风控黑名单列表。
  rpc ListBlacklists(BlacklistListRequest) returns (BlacklistListResponse);
  // 新增风控黑名单。
  rpc AddBlacklist(BlacklistRequest) returns (CommonResponse);
  // 解除风控黑名单。
  rpc ReleaseBlacklist(BlacklistRequest) returns (CommonResponse);
  // 查询风控命中记录。
  rpc ListRiskHitRecords(RiskHitRecordListRequest) returns (RiskHitRecordListResponse);
}

