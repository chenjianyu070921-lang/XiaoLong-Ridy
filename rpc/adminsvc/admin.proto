  repeated OrderStatusLog status_logs = 2;
  repeated DispatchRecord dispatch_records = 3;
  OrderPrice price = 4;
  Payment payment = 5;
  Settlement settlement = 6;
  repeated string degraded = 7;
}

message OrderListResponse {
  repeated Order list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AbnormalOrderListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string abnormal_type = 4;
  int64 user_id = 5;
  int64 driver_id = 6;
  string start_time = 7;
  string end_time = 8;
}

message CouponListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int32 type = 4;
  int32 status = 5;
  string start_time = 6;
  string end_time = 7;
}

message CouponRequest {
  int64 id = 1;
  string name = 2;
  int32 type = 3;
  string face_value = 4;
  string discount = 5;
