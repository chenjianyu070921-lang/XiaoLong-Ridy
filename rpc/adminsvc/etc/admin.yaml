Name: admin.rpc
ListenOn: 0.0.0.0:8084
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: admin.rpc
MySQL:
  # 真实数据库连接串由环境变量 ADMINSVC_MYSQL_DSN 注入，禁止在此提交明文凭据。
  DSN: ""
Cache:
  Host: 115.191.16.159:6379
  # 真实 Redis 密码由环境变量 ADMINSVC_REDIS_PASSWORD 注入，禁止在此提交明文凭据。
  Password: ""
  DB: 0
Session:
  SessionTTLHours: 24
  TokenPrefix: "admin:sess:"
MenuRoles:
  1:
