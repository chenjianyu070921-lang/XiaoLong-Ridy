<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .title }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="auth-shell" data-view="auth">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="brand-block">
        <p class="eyebrow">Driver Web</p>
        <h1 id="auth-title">司机登录</h1>
      </div>

      <div class="switch-row" aria-label="登录注册切换">
        <button class="switch-button is-active" type="button" data-auth-target="login">登录</button>
        <button class="switch-button" type="button" data-auth-target="register">注册</button>
      </div>

      <form class="auth-form is-active" data-auth-form="login" action="/driver/login" method="post">
        <label>
          <span>手机号</span>
          <input type="tel" name="phone" autocomplete="tel" placeholder="请输入手机号" required>
        </label>
        <label>
          <span>密码</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
        </label>
        <button class="primary-button" type="submit">登录</button>
      </form>

      <form class="auth-form" data-auth-form="register" action="/driver/register" method="post">
        <label>
          <span>手机号</span>
          <input type="tel" name="phone" autocomplete="tel" placeholder="请输入手机号" required>
        </label>
        <label>
          <span>姓名</span>
          <input type="text" name="realName" autocomplete="name" placeholder="请输入真实姓名" required>
        </label>
        <label>
          <span>身份证号</span>
          <input type="text" name="idCardNo" autocomplete="off" placeholder="请输入身份证号" required>
        </label>
        <label>
          <span>驾驶证号</span>
          <input type="text" name="driverLicenseNo" autocomplete="off" placeholder="请输入驾驶证号" required>
        </label>
        <label>
          <span>头像地址</span>
          <input type="url" name="avatarUrl" autocomplete="off" placeholder="可选">
        </label>
        <label>
          <span>密码</span>
          <input type="password" name="password" autocomplete="new-password" placeholder="设置登录密码" required>
        </label>
        <button class="primary-button" type="submit">注册</button>
      </form>
      <p class="form-message" data-form-message role="status"></p>
    </section>
  </main>

  <main class="dashboard-shell" data-view="dashboard" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow">Driver Console</p>
        <h1>司机工作台</h1>
      </div>
      <div class="menu-wrap">
        <button class="icon-button" type="button" aria-label="打开菜单" data-menu-button>
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="menu-panel" data-menu-panel hidden>
          <button type="button" data-panel-target="profile">个人信息</button>
          <button type="button" data-panel-target="edit">修改司机信息</button>
          <button type="button" data-logout>退出登录</button>
        </div>
      </div>
    </header>

    <section class="hero-band">
      <div class="driver-identity">
        <div class="avatar-frame">
          <img data-driver-avatar alt="司机头像" hidden>
          <span data-driver-initial>司</span>
        </div>
        <div>
          <p class="muted">当前司机</p>
          <h2 data-driver-name>司机</h2>
          <p class="muted" data-driver-phone>--</p>
        </div>
      </div>

      <div class="score-block">
        <p class="muted">服务分</p>
        <strong data-service-score>--</strong>
      </div>

      <div class="work-actions" aria-label="上下线操作">
        <button class="primary-button action-button" type="button" data-online>上线接单</button>
        <button class="secondary-button action-button" type="button" data-offline>下线休息</button>
      </div>
    </section>

    <section class="status-strip" aria-label="当前状态">
      <div class="status-current">
        <span class="status-dot" data-status-dot></span>
        <div>
          <p class="muted">当前状态</p>
          <strong data-current-status>下线休息</strong>
        </div>
      </div>
      <div class="status-cards">
        <div class="status-card" data-status-card="idle">
          <span>空闲中</span>
          <strong data-idle-state>离线休息</strong>
        </div>
        <div class="status-card" data-status-card="pickup">
          <span>正在接驾</span>
          <strong data-pickup-state>空闲</strong>
        </div>
        <div class="status-card" data-status-card="trip">
          <span>行程进行中</span>
          <strong data-trip-state>空闲</strong>
        </div>
      </div>
    </section>

    <section class="core-area" aria-label="中间核心区域">
      <article class="trip-board">
        <div class="panel-title">
          <div>
            <p class="eyebrow">Trip Center</p>
            <h2>当前行程</h2>
          </div>
          <span class="core-pill" data-core-pill>空闲</span>
        </div>

        <div class="idle-state" data-trip-empty>
          <span class="idle-badge" data-idle-badge>空闲状态</span>
          <strong data-idle-title>没接单</strong>
          <p data-idle-desc>当前没有接驾或行程任务，上线后等待系统派单。</p>
          <div class="idle-meta">
            <span>正在接驾：空闲</span>
            <span>行程进行中：空闲</span>
          </div>
        </div>

        <div class="route-box">
          <div>
            <span>上车点</span>
            <strong data-from-address>--</strong>
          </div>
          <div>
            <span>目的地</span>
            <strong data-to-address>--</strong>
          </div>
        </div>
      </article>

      <article class="dispatch-board">
        <div class="panel-title">
          <div>
            <p class="eyebrow">Order Action</p>
            <h2>接单操作</h2>
          </div>
        </div>

        <label>
          <span>订单ID</span>
          <input type="number" min="1" step="1" inputmode="numeric" placeholder="请输入订单ID" data-order-id>
        </label>

        <div class="order-actions">
          <button class="primary-button order-button" type="button" data-order-action="accept">接单</button>
          <button class="secondary-button order-button" type="button" data-order-action="confirm-arrive">确认到达</button>
          <button class="secondary-button order-button" type="button" data-order-action="start-trip">开始行程</button>
          <button class="secondary-button order-button" type="button" data-order-action="finish-trip">结束行程</button>
        </div>
      </article>
    </section>

    <section class="detail-layout">
      <article class="info-panel" data-panel="profile">
        <div class="panel-title">
          <h2>个人信息</h2>
          <button class="text-button" type="button" data-refresh>刷新</button>
        </div>
        <dl class="profile-list">
          <div><dt>司机ID</dt><dd data-profile-id>--</dd></div>
          <div><dt>手机号</dt><dd data-profile-phone>--</dd></div>
          <div><dt>驾驶证号</dt><dd data-profile-license>--</dd></div>
          <div><dt>账号状态</dt><dd data-profile-status>--</dd></div>
        </dl>
      </article>

      <article class="info-panel" data-panel="edit" hidden>
        <div class="panel-title">
          <h2>修改司机信息</h2>
          <button class="text-button" type="button" data-panel-target="profile">返回</button>
        </div>
        <form class="edit-form" data-edit-form action="/driver/update" method="post">
          <label>
            <span>姓名</span>
            <input type="text" name="realName" data-edit-real-name>
          </label>
          <label>
            <span>头像地址</span>
            <input type="url" name="avatarUrl" data-edit-avatar-url>
          </label>
          <label>
            <span>驾驶证号</span>
            <input type="text" name="driverLicenseNo" data-edit-license>
          </label>
          <button class="primary-button" type="submit">保存修改</button>
        </form>
      </article>
    </section>

    <p class="dashboard-message" data-dashboard-message role="status"></p>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
